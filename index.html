    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['Inter', 'Microsoft JhengHei', 'sans-serif'],
                },
                extend: {
                    colors: {
                        bgDark: '#0f172a',
                        glass: 'rgba(30, 41, 59, 0.7)',
                        glassHover: 'rgba(51, 65, 85, 0.8)',
                        accent: '#3b82f6',
                        accentGlow: 'rgba(59, 130, 246, 0.5)',
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(59, 130, 246, 0.4)',

                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },

    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        /* Checkbox Customization */
        .custom-checkbox {
            appearance: none;
            background-color: rgba(255,255,255,0.05);
            margin: 0;
            font: inherit;
            width: 1.2em;
            height: 1.2em;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut, signInWithCustomToken } from "firebase/auth";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc } from "firebase/firestore";
        import { getAnalytics } from "firebase/analytics";

        // --- Firebase Configuration ---

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const apiKey = ""; // Gemini API Key

        // --- ICS Export Utility ---
        const downloadICS = (project) => {
            const formatDate = (dateStr) => dateStr.replace(/-/g, '');
            const getNextDay = (dateStr) => {
                if (!dateStr) return '';
                const date = new Date(dateStr);
                date.setDate(date.getDate() + 1);
                return date.toISOString().split('T')[0].replace(/-/g, '');
            };

            const startDate = formatDate(project.startDate);
            const endDate = getNextDay(project.deadline);

            let description = `備註: ${project.notes || '無'}\\n\\n子任務清單:\\n`;
            if (project.subtasks && Array.isArray(project.subtasks)) {
                project.subtasks.forEach(task => {
                    const status = task.completed ? '[v]' : '[ ]';
                    description += `${status} ${task.text}\\n`;
                });
            }

            const icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Kevin Yang Dashboard//ZH',
                'BEGIN:VEVENT',
                `UID:${project.id}-${Date.now()}@kevin-dashboard`,
                `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
                `DTSTART;VALUE=DATE:${startDate}`,
                `DTEND;VALUE=DATE:${endDate}`,
                `SUMMARY:[${project.category}] ${project.title}`,
                `DESCRIPTION:${description}`,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${project.title}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- Components ---

        const LoginScreen = ({ onLogin, onGuest }) => {
            return (
                <div className="min-h-screen flex items-center justify-center relative p-4">
                    {/* Background Ambient Glows */}
                    <div className="fixed top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[128px] pointer-events-none"></div>
                    <div className="fixed bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-purple-600/15 rounded-full blur-[128px] pointer-events-none"></div>

                    <div className="glass-panel max-w-md w-full p-8 rounded-2xl shadow-2xl text-center border border-white/10 z-10 animate-fade-in">
                        <div className="mb-8">
                            <div className="w-20 h-20 bg-accent/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-accent/30 shadow-glow">
                                <i className="fa-solid fa-layer-group text-3xl text-accent"></i>
                            </div>
                            <h1 className="text-3xl font-black italic tracking-tighter text-white mb-2">
                                Kevin Yang
                            </h1>
                            <p className="text-slate-400 text-sm">專案進度管理儀表板</p>
                        </div>

                        <div className="space-y-4">
                            <button 
                                onClick={onLogin}
                                className="w-full bg-white text-slate-900 font-bold py-3 px-4 rounded-xl hover:bg-slate-100 transition-all flex items-center justify-center gap-3 shadow-lg"
                            >
                                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5" alt="Google" />
                                使用 Google 帳號登入
                            </button>
                            
                            <div className="relative py-2">
                                <div className="absolute inset-0 flex items-center">
                                    <div className="w-full border-t border-slate-700"></div>
                                </div>
                                <div className="relative flex justify-center text-sm">
                                    <span className="px-2 bg-[#172033] text-slate-500">或</span>
                                </div>
                            </div>

                            <button 
                                onClick={onGuest}
                                className="w-full bg-slate-800/50 text-slate-300 font-medium py-3 px-4 rounded-xl hover:bg-slate-800 hover:text-white border border-slate-700 transition-all"
                            >
                                <i className="fa-solid fa-user-secret mr-2"></i>
                                訪客模式 (Guest)
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, onClose, onConfirm, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-sm glass-panel rounded-xl p-6 animate-fade-in text-center border border-white/10 shadow-2xl">
                        <div className="text-4xl text-red-400 mb-4"><i className="fa-solid fa-triangle-exclamation"></i></div>
                        <h3 className="text-lg font-bold text-white mb-2">確認刪除</h3>
                        <div className="mb-6 text-slate-300 text-sm">{message}</div>
                        <div className="flex justify-center gap-3">
                            <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all">取消</button>
                            <button onClick={onConfirm} className="px-5 py-2 rounded-lg text-sm font-bold text-white bg-red-500 hover:bg-red-600 shadow-lg shadow-red-500/20 transition-all">
                                確定刪除
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ReportModal = ({ isOpen, onClose, projects }) => {
            if (!isOpen) return null;

            const [dateRange, setDateRange] = useState({ start: '', end: '' });

            useEffect(() => {
                if(isOpen) {
                    const now = new Date();
                    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
                    const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
                    setDateRange({ start: firstDay, end: lastDay });
                }
            }, [isOpen]);

            const filteredData = useMemo(() => {
                if (!dateRange.start || !dateRange.end) return [];
                return projects.filter(p => {
                    return p.startDate <= dateRange.end && p.deadline >= dateRange.start;
                });
            }, [projects, dateRange]);

            const getMonthDisplay = (start, end) => {
                const s = new Date(start);
                const e = new Date(end);
                if (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) {
                    return `${s.getMonth() + 1}月`;
                }
                return `${s.getMonth() + 1}月 - ${e.getMonth() + 1}月`;
            };

            const getStatus = (p) => {
                const total = p.subtasks ? p.subtasks.length : 0;
                const completed = p.subtasks ? p.subtasks.filter(t => t.completed).length : 0;
                return (total > 0 && total === completed) ? '已完成' : '進行中';
            };

            const exportCSV = () => {
                let csvContent = "\uFEFF";
                csvContent += "專案名稱,類別,開始日期,截止日期,執行月份,狀態,進度\n";

                filteredData.forEach(p => {
                    const status = getStatus(p);
                    const subtasks = p.subtasks || [];
                    const progress = subtasks.length > 0 
                        ? Math.round((subtasks.filter(t => t.completed).length / subtasks.length) * 100) + '%' 
                        : '0%';
                    const month = getMonthDisplay(p.startDate, p.deadline);
                    
                    csvContent += `"${p.title}","${p.category}","${p.startDate}","${p.deadline}","${month}","${status}","${progress}"\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.setAttribute("download", `Project_Report_${dateRange.start}_${dateRange.end}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-3xl glass-panel rounded-2xl shadow-2xl flex flex-col max-h-[90vh] animate-fade-in">
                        <div className="px-6 py-4 border-b border-white/10 bg-slate-800/50 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white tracking-wide">
                                <i className="fa-solid fa-chart-pie text-accent mr-2"></i>專案時程報表
                            </h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors">
                                <i className="fa-solid fa-times text-lg"></i>
                            </button>
                        </div>
                        <div className="p-6 pb-2 grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">起始日期</label>
                                <input 
                                    type="date" 
                                    className="w-full glass-input px-3 py-2 rounded-lg text-sm"
                                    value={dateRange.start}
                                    onChange={e => setDateRange({...dateRange, start: e.target.value})}
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">結束日期</label>
                                <input 
                                    type="date" 
                                    className="w-full glass-input px-3 py-2 rounded-lg text-sm"
                                    value={dateRange.end}
                                    onChange={e => setDateRange({...dateRange, end: e.target.value})}
                                />
                            </div>
                        </div>
                        <div className="flex-grow overflow-auto p-6 custom-scrollbar">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="text-xs text-slate-400 uppercase border-b border-white/10">
                                        <th className="pb-3 pl-2">專案名稱</th>
                                        <th className="pb-3">類別</th>
                                        <th className="pb-3">執行月份</th>
                                        <th className="pb-3">狀態</th>
                                    </tr>
                                </thead>
                                <tbody className="text-sm">
                                    {filteredData.map(p => {
                                        const isCompleted = getStatus(p) === '已完成';
                                        return (
                                            <tr key={p.id} className="border-b border-white/5 hover:bg-white/5 transition-colors">
                                                <td className="py-3 pl-2 font-medium text-white">{p.title}</td>
                                                <td className="py-3 text-slate-300">{p.category}</td>
                                                <td className="py-3 text-slate-300 font-mono">{getMonthDisplay(p.startDate, p.deadline)}</td>
                                                <td className="py-3">
                                                    <span className={`px-2 py-1 rounded text-xs font-bold ${isCompleted ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                                        {getStatus(p)}
                                                    </span>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {filteredData.length === 0 && (
                                        <tr>
                                            <td colSpan="4" className="text-center py-8 text-slate-500 italic">此區間無專案資料</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-4 border-t border-white/10 bg-slate-800/50 flex justify-end gap-3">
                            <button onClick={onClose} className="px-5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">關閉</button>
                            <button onClick={exportCSV} disabled={filteredData.length === 0} className="px-5 py-2 rounded-lg text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2">
                                <i className="fa-solid fa-file-csv"></i> 匯出 CSV
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const CircularProgress = ({ percentage, size = 60, strokeWidth = 5 }) => {
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (percentage / 100) * circumference;

            return (
                <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
                    <svg className="transform -rotate-90 w-full h-full">
                        <circle className="text-slate-700" strokeWidth={strokeWidth} stroke="currentColor" fill="transparent" r={radius} cx={size / 2} cy={size / 2} />
                        <circle className="text-accent transition-all duration-1000 ease-out" strokeWidth={strokeWidth} strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round" stroke="currentColor" fill="transparent" r={radius} cx={size / 2} cy={size / 2} />
                    </svg>
                    <span className="absolute text-xs font-bold text-white">{percentage}%</span>
                </div>
            );
        };

        const Badge = ({ category }) => {
            const getColors = (cat) => {
                switch(cat) {
                    case "社群官網": return "bg-cyan-500/10 text-cyan-400 border-cyan-500/30";
                    case "設計": return "bg-pink-500/10 text-pink-400 border-pink-500/30";
                    case "數位廣告": return "bg-purple-500/10 text-purple-400 border-purple-500/30";
                    case "展覽": return "bg-amber-500/10 text-amber-400 border-amber-500/30";
                    case "影片": return "bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
                    default: return "bg-slate-500/10 text-slate-400 border-slate-500/30";
                }
            };
            return (
                <span className={`px-2.5 py-0.5 rounded text-[11px] font-medium border tracking-wide ${getColors(category)}`}>
                    {category}
                </span>
            );
        };

        const ProjectCard = ({ project, onToggleTask, onDelete, onEdit, onQuickComplete }) => {
            const [expanded, setExpanded] = useState(false);

            const total = project.subtasks ? project.subtasks.length : 0;
            const completed = project.subtasks ? project.subtasks.filter(t => t.completed).length : 0;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            const { daysLeft, statusColor, statusLabel } = useMemo(() => {
                const today = new Date();
                today.setHours(0,0,0,0);
                const due = new Date(project.deadline);
                due.setHours(0,0,0,0);
                const diffTime = due - today;
                const days = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                let color = "text-slate-300";
                let label = "DAYS LEFT";

                if (days < 0) {
                    color = "text-red-500";
                    label = "OVERDUE";
                } else if (days === 0) {
                    color = "text-amber-400";
                    label = "DUE TODAY";
                } else if (days < 3) {
                    color = "text-red-400";
                }

                return { daysLeft: days, statusColor: color, statusLabel: label };
            }, [project.deadline]);

            return (
                <div className={`glass-panel rounded-xl mb-5 transition-all duration-300 group overflow-hidden ${expanded ? 'bg-slate-800/80 ring-1 ring-white/10' : 'hover:bg-slate-800/40'}`}>
                    
                    <div className="p-5 flex items-center justify-between cursor-pointer relative" onClick={() => setExpanded(!expanded)}>
                        <div className="flex items-center gap-5">
                            <div className="flex-shrink-0">
                                <CircularProgress percentage={percentage} size={56} strokeWidth={4} />
                            </div>
                            <div>
                                <div className="flex items-center gap-3 mb-1">
                                    <Badge category={project.category} />
                                    <span className="text-xs text-slate-400 font-mono tracking-wide">{project.deadline}</span>
                                </div>
                                <h3 className="text-xl font-bold text-white group-hover:text-accent transition-colors tracking-tight">
                                    {project.title}
                                </h3>
                            </div>
                        </div>

                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-2 mr-2 opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-x-2 group-hover:translate-x-0">
                                <button onClick={(e) => { e.stopPropagation(); onQuickComplete(project); }} className="w-8 h-8 rounded-full bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500 hover:text-white border border-emerald-500/20 flex items-center justify-center transition-all shadow-lg hover:shadow-emerald-500/30" title="全部完成">
                                    <i className="fa-solid fa-check"></i>
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); onDelete(project.id); }} className="w-8 h-8 rounded-full bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/20 flex items-center justify-center transition-all shadow-lg hover:shadow-red-500/30" title="快速刪除">
                                    <i className="fa-solid fa-trash"></i>
                                </button>
                            </div>

                            <div className={`flex flex-col items-end ${statusColor}`}>

                                <i className="fa-solid fa-chevron-down text-sm text-slate-400"></i>
                            </div>
                        </div>
                    </div>

                    <div className={`transition-all duration-500 ease-in-out overflow-hidden ${expanded ? 'max-h-[600px] opacity-100' : 'max-h-0 opacity-0'}`}>
                        <div className="p-6 pt-2 border-t border-white/5 grid grid-cols-1 md:grid-cols-12 gap-8">
                            <div className="md:col-span-7">
                                <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Subtasks</h4>
                                <div className="space-y-3">
                                    {project.subtasks && project.subtasks.map(task => (
                                        <div key={task.id} className="flex items-start gap-3 group/item">
                                            <input type="checkbox" checked={task.completed} onChange={() => onToggleTask(project, task.id)} className="custom-checkbox mt-0.5 flex-shrink-0" />
                                            <span className={`text-sm leading-relaxed transition-all ${task.completed ? 'text-slate-500 line-through decoration-slate-600' : 'text-slate-200'}`}>
                                                {task.text}
                                            </span>
                                        </div>
                                    ))}
                                    {(!project.subtasks || project.subtasks.length === 0) && <p className="text-slate-500 italic text-sm">無子任務</p>}
                                </div>
                            </div>

                            <div className="md:col-span-5 flex flex-col h-full bg-slate-900/30 rounded-lg p-4 border border-white/5">
                                <div className="flex-grow">
                                    <div className="mb-4">
                                        <h4 className="text-[10px] font-bold text-slate-500 uppercase mb-1">Schedule</h4>
                                        <div className="flex justify-between text-sm text-slate-300 font-mono bg-slate-800/50 p-2 rounded border border-white/5">
                                            <span>{project.startDate}</span>
                                            <span className="text-slate-600">to</span>
                                            <span>{project.deadline}</span>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className="text-[10px] font-bold text-slate-500 uppercase mb-1">Notes</h4>
                                        <p className="text-sm text-slate-400 leading-relaxed min-h-[60px]">{project.notes || "無備註"}</p>
                                    </div>
                                </div>
                                <div className="flex gap-2 mt-4 pt-4 border-t border-white/5">
                                    <button onClick={() => downloadICS(project)} className="flex-1 py-1.5 rounded bg-indigo-500/20 hover:bg-indigo-500/40 text-xs text-indigo-300 border border-indigo-500/30 transition-colors flex items-center justify-center gap-1.5" title="匯出 ICS 行事曆">
                                        <i className="fa-solid fa-calendar-alt"></i> 行事曆
                                    </button>
                                    <button onClick={() => onEdit(project)} className="flex-1 py-1.5 rounded bg-slate-700/50 hover:bg-slate-700 text-xs text-slate-300 transition-colors">編輯</button>
                                    <button onClick={() => onDelete(project.id)} className="flex-1 py-1.5 rounded bg-red-500/10 hover:bg-red-500/20 text-xs text-red-400 border border-red-500/20 transition-colors">刪除</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AddProjectModal = ({ isOpen, onClose, onSave, projectToEdit }) => {
            if (!isOpen) return null;

            const defaultFormState = {
                title: '',
                category: '社群官網',
                startDate: '',
                deadline: '',
                notes: '',
                subtasks: [{ id: Date.now(), text: '', completed: false }]
            };

            const [form, setForm] = useState(defaultFormState);
            const [isGenerating, setIsGenerating] = useState(false);
            const subtaskInputRefs = useRef([]);
            const prevSubtaskCount = useRef(form.subtasks.length);

            useEffect(() => {
                if (isOpen && projectToEdit) {
                    setForm(projectToEdit);
                } else if (isOpen) {
                    setForm({ ...defaultFormState, subtasks: [{ id: Date.now(), text: '', completed: false }] });
                }
            }, [isOpen, projectToEdit]);

            useEffect(() => {
                if (form.subtasks.length > prevSubtaskCount.current) {
                    const lastIndex = form.subtasks.length - 1;
                    if (subtaskInputRefs.current[lastIndex]) {
                        subtaskInputRefs.current[lastIndex].focus();
                    }
                }
                prevSubtaskCount.current = form.subtasks.length;
            }, [form.subtasks.length]);

            const updateSubtask = (idx, val) => {
                const newTasks = [...form.subtasks];
                newTasks[idx].text = val;
                setForm({...form, subtasks: newTasks});
            };

            const addSubtaskRow = () => {
                setForm({
                    ...form, 
                    subtasks: [...form.subtasks, { id: Date.now() + Math.random(), text: '', completed: false }]
                });
            };

            const removeSubtaskRow = (idx) => {
                const newTasks = form.subtasks.filter((_, i) => i !== idx);
                setForm({...form, subtasks: newTasks});
            };

            // --- Gemini API Integration (With Retry Logic) ---
            const callGeminiAPI = async (prompt) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                category: { type: "STRING", enum: ["社群官網", "設計", "數位廣告", "展覽", "影片"] },
                                description: { type: "STRING" },
                                subtasks: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            text: { type: "STRING" },
                                            completed: { type: "BOOLEAN" }
                                        }
                                    }
                                },
                                notes: { type: "STRING" }
                            }
                        }
                    }
                };

                let retries = 0;
                const maxRetries = 5;
                const delays = [1000, 2000, 4000, 8000, 16000];

                while (retries <= maxRetries) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            throw new Error(`API Error: ${response.status} ${response.statusText}`);
                        }

                        const data = await response.json();
                        return data;

                    } catch (error) {
                        if (retries === maxRetries) throw error;
                        await new Promise(resolve => setTimeout(resolve, delays[retries]));
                        retries++;
                    }
                }
            };

            const handleAIGenerate = async () => {
                if (!form.title) {
                    alert("請先輸入專案名稱，AI 才能為您提供建議。");
                    return;
                }

                setIsGenerating(true);
                try {
                    const prompt = `
                        You are a project management assistant. Generate a JSON object for a project based on the title: '${form.title}'.
                        The JSON should adhere to this structure:
                        {
                            "category": "One of ['社群官網', '設計', '數位廣告', '展覽', '影片']",
                            "description": "A professional summary in Traditional Chinese",
                            "subtasks": [
                                { "text": "Task 1 in Traditional Chinese", "completed": false },
                                { "text": "Task 2 in Traditional Chinese", "completed": false },
                                { "text": "Task 3 in Traditional Chinese", "completed": false }
                            ],
                            "notes": "A helpful tip or execution note in Traditional Chinese"
                        }
                        Make sure subtasks are concrete and actionable.
                    `;

                    const data = await callGeminiAPI(prompt);
                    
                    if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                         let rawText = data.candidates[0].content.parts[0].text;
                         rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                         const generatedContent = JSON.parse(rawText);
                         setForm(prev => ({
                             ...prev,
                             category: generatedContent.category || prev.category,
                             notes: generatedContent.notes || generatedContent.description || prev.notes,
                             subtasks: generatedContent.subtasks && generatedContent.subtasks.length > 0 
                                ? generatedContent.subtasks.map((t, i) => ({ id: Date.now() + i, text: t.text, completed: false }))
                                : prev.subtasks
                         }));
                    } else {
                        throw new Error("No candidates returned from Gemini API");
                    }

                } catch (error) {
                    console.error("AI Generation Error:", error);
                    alert(`AI 生成失敗: ${error.message}，請檢查 API 金鑰或網路連線。`);
                } finally {
                    setIsGenerating(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const cleanTasks = form.subtasks.filter(t => t.text.trim() !== '');
                onSave({ ...form, subtasks: cleanTasks });
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-2xl glass-panel rounded-2xl shadow-glass overflow-hidden animate-fade-in flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b border-white/10 bg-slate-800/50 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white tracking-wide">
                                <i className="fa-solid fa-layer-group text-accent mr-2"></i>
                                {projectToEdit ? 'Edit Project' : 'New Project'}
                            </h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors">
                                <i className="fa-solid fa-times text-lg"></i>
                            </button>
                        </div>
                        <div className="overflow-y-auto p-6 custom-scrollbar">
                            <form id="projectForm" onSubmit={handleSubmit} className="space-y-5">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div className="md:col-span-2">
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="block text-xs font-bold text-slate-400 uppercase">Project Name</label>
                                            <button type="button" onClick={handleAIGenerate} disabled={isGenerating} className={`text-xs font-bold px-2 py-1 rounded transition-all flex items-center gap-1 ${isGenerating ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : 'bg-gradient-to-r from-purple-500 to-indigo-500 text-white hover:shadow-lg hover:from-purple-400 hover:to-indigo-400'}`}>
                                                {isGenerating ? <><i className="fa-solid fa-spinner fa-spin"></i> Generating...</> : <><i className="fa-solid fa-wand-magic-sparkles"></i> AI 智能填寫</>}
                                            </button>
                                        </div>
                                        <input required type="text" className="w-full glass-input px-4 py-2.5 rounded-lg focus:ring-2 ring-accent/50 placeholder-slate-500" placeholder="輸入專案名稱 (例如: 舉辦年終尾牙)" value={form.title} onChange={e => setForm({...form, title: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Category</label>
                                        <select className="w-full glass-input px-4 py-2.5 rounded-lg appearance-none cursor-pointer" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
                                            <option className="bg-slate-900" value="社群官網">社群官網</option>
                                            <option className="bg-slate-900" value="設計">設計</option>
                                            <option className="bg-slate-900" value="數位廣告">數位廣告</option>
                                            <option className="bg-slate-900" value="展覽">展覽</option>
                                            <option className="bg-slate-900" value="影片">影片</option>
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Start</label>
                                            <input required type="date" className="w-full glass-input px-2 py-2.5 rounded-lg text-sm" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-1">End</label>
                                            <input required type="date" className="w-full glass-input px-2 py-2.5 rounded-lg text-sm" value={form.deadline} onChange={e => setForm({...form, deadline: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Subtasks</label>
                                        <div className="space-y-2 mb-2">
                                            {form.subtasks.map((task, idx) => (
                                                <div key={task.id} className="flex gap-2">
                                                    <input ref={el => subtaskInputRefs.current[idx] = el} type="text" className="flex-grow glass-input px-3 py-2 rounded text-sm placeholder-slate-600" placeholder="任務描述..." value={task.text} onChange={(e) => updateSubtask(idx, e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addSubtaskRow(); } }} />
                                                    <button type="button" onClick={() => removeSubtaskRow(idx)} className="px-2 text-slate-500 hover:text-red-400 transition-colors"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                        <button type="button" onClick={addSubtaskRow} className="text-xs text-accent hover:text-blue-400 font-medium flex items-center gap-1"><i className="fa-solid fa-plus"></i> Add Subtask</button>
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Notes</label>
                                        <textarea className="w-full glass-input px-4 py-2.5 rounded-lg h-24 resize-none" placeholder="備註事項..." value={form.notes} onChange={e => setForm({...form, notes: e.target.value})}></textarea>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div className="p-4 border-t border-white/10 bg-slate-800/50 flex justify-end gap-3">
                            <button onClick={onClose} className="px-5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">Cancel</button>
                            <button form="projectForm" type="submit" className="px-6 py-2 rounded-lg text-sm font-bold text-white bg-accent shadow-glow hover:bg-blue-600 active:scale-95 transition-all">{projectToEdit ? 'Save Changes' : 'Create Project'}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [projects, setProjects] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isReportModalOpen, setIsReportModalOpen] = useState(false);
            const [filter, setFilter] = useState('all'); 
            const [editingProject, setEditingProject] = useState(null); 
            const [deleteModalOpen, setDeleteModalOpen] = useState(false);
            const [projectToDelete, setProjectToDelete] = useState(null);
            const [loading, setLoading] = useState(true);

            // --- Authentication ---
            useEffect(() => {
                // Initialize auth based on env or anonymous
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await window.signInWithCustomToken(window.auth, __initial_auth_token);
                        } else {
                            // Try to see if user is already logged in or sign in anonymously if needed
                            // For this environment, we just wait for onAuthStateChanged to fire
                        }
                    } catch (e) {
                        console.error("Auto login failed", e);
                    } finally {
                        // We rely on onAuthStateChanged to set user, but if no user, we might want to default to something or show login
                    }
                };
                initAuth();

                const unsubscribe = window.onAuthStateChanged(window.auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // --- Data Fetching ---
            useEffect(() => {
                if (!user) {
                    setProjects([]);
                    return;
                }

                const projectsRef = window.collection(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects');
                // Use simple query as complex queries require indexes
                const q = window.query(projectsRef);

                const unsubscribe = window.onSnapshot(q, (snapshot) => {
                    const loadedProjects = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    // Sort in memory instead of query to avoid index issues
                    loadedProjects.sort((a, b) => b.createdAt - a.createdAt);
                    setProjects(loadedProjects);
                }, (error) => {
                    console.error("Firestore Error:", error);
                });

                return () => unsubscribe();
            }, [user]);

            // --- Handlers ---
            const handleLogin = async () => {
                const provider = new window.GoogleAuthProvider();
                try {
                    await window.signInWithPopup(window.auth, provider);
                } catch (error) {
                    console.error("Login failed:", error);
                    if (error.code === 'auth/unauthorized-domain') {
                        const domain = window.location.hostname;
                        alert(`Google 登入失敗：網域 (${domain}) 未授權。\n\n請前往 Firebase Console -> Authentication -> Settings -> Authorized Domains，並將此網域加入允許清單。\n\n或者請使用「訪客模式」繼續。`);
                    } else if (error.code === 'auth/popup-closed-by-user') {
                        // User closed popup, ignore
                    } else {
                        alert(`登入失敗: ${error.message}`);
                    }
                }
            };

            const handleGuestLogin = async () => {
                try {
                    await window.signInAnonymously(window.auth);
                } catch (error) {
                    console.error("Guest login failed:", error);
                    alert(`訪客登入失敗: ${error.message}`);
                }
            };

            const handleLogout = async () => {
                try {
                    await window.signOut(window.auth);
                } catch (error) {
                    console.error("Logout failed:", error);
                }
            };

            const handleToggleTask = async (project, taskId) => {
                if (!user) return;
                const updatedSubtasks = project.subtasks.map(t => 
                    t.id === taskId ? { ...t, completed: !t.completed } : t
                );
                
                const docRef = window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', project.id);
                try {
                    await window.updateDoc(docRef, { subtasks: updatedSubtasks });
                } catch (e) {
                    console.error("Update failed", e);
                }
            };

            const handleQuickComplete = async (project) => {
                if (!user) return;
                const updatedSubtasks = project.subtasks.map(t => ({ ...t, completed: true }));
                
                const docRef = window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', project.id);
                try {
                    await window.updateDoc(docRef, { subtasks: updatedSubtasks });
                } catch (e) {
                    console.error("Quick complete failed", e);
                }
            };

            const handleOpenDelete = (id) => {
                setProjectToDelete(id);
                setDeleteModalOpen(true);
            };

            const handleConfirmDelete = async () => {
                if (projectToDelete && user) {
                    const docRef = window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', projectToDelete);
                    try {
                        await window.deleteDoc(docRef);
                        setDeleteModalOpen(false);
                        setProjectToDelete(null);
                    } catch (e) {
                        console.error("Delete failed", e);
                    }
                }
            };

            const handleOpenEdit = (project) => {
                setEditingProject(project);
                setIsModalOpen(true);
            };

            const handleOpenAdd = () => {
                setEditingProject(null);
                setIsModalOpen(true);
            };

            const handleSaveProject = async (projectData) => {
                if (!user) return;

                try {
                    if (editingProject) {
                        // Update existing
                        const docRef = window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', projectData.id);
                        await window.setDoc(docRef, {
                            ...projectData,
                            updatedAt: Date.now()
                        }, { merge: true });
                    } else {
                        // Create new
                        const projectsRef = window.collection(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects');
                        await window.addDoc(projectsRef, {
                            ...projectData,
                            createdAt: Date.now()
                        });
                    }
                    setIsModalOpen(false);
                    setEditingProject(null);
                } catch (e) {
                    console.error("Save failed", e);
                    alert("儲存失敗，請檢查網路連線。");
                }
            };

            const filteredProjects = projects.filter(p => {
                const total = p.subtasks ? p.subtasks.length : 0;
                const completed = p.subtasks ? p.subtasks.filter(t => t.completed).length : 0;
                const isComplete = total > 0 && total === completed;

                if (filter === 'completed') return isComplete;
                if (filter === 'active') return !isComplete;
                return true;
            });

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#0f172a]">
                        <div className="text-white text-xl animate-pulse">載入中...</div>
                    </div>
                );
            }

            if (!user) {
                return <LoginScreen onLogin={handleLogin} onGuest={handleGuestLogin} />;
            }

            return (
                <div className="min-h-screen relative pb-20">
                    <div className="fixed top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[128px] pointer-events-none"></div>
                    <div className="fixed bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-purple-600/15 rounded-full blur-[128px] pointer-events-none"></div>

                    <div className="max-w-4xl mx-auto px-6 py-12 relative z-10">
                        <header className="flex flex-col md:flex-row md:items-end justify-between mb-8 pb-6 border-b border-white/5">
                            <div className="mb-4 md:mb-0">
                                <h1 className="text-3xl font-black italic tracking-tighter text-white mb-2">
                                    Kevin Yang <span className="text-slate-500 not-italic font-normal text-xl ml-2">工作進度</span>
                                </h1>
                                <div className="flex items-center gap-2">
                                    <p className="text-slate-400 text-sm font-light tracking-wide">
                                        Projects Dashboard & Timeline
                                    </p>
                                    <span className="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">
                                        {user.isAnonymous ? 'Guest' : user.email}
                                    </span>
                                    <button onClick={handleLogout} className="text-xs text-red-400 hover:text-red-300 ml-2">登出</button>
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => setIsReportModalOpen(true)} className="group flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 px-5 py-3 rounded-lg transition-all duration-300 transform hover:-translate-y-1">
                                    <i className="fa-solid fa-chart-line text-sm text-accent"></i>
                                    <span className="font-bold text-sm tracking-wide">報表與匯出</span>
                                </button>
                                <button onClick={handleOpenAdd} className="group flex items-center gap-2 bg-accent/90 hover:bg-blue-500 text-white px-6 py-3 rounded-lg shadow-glow transition-all duration-300 transform hover:-translate-y-1">
                                    <i className="fa-solid fa-plus text-sm group-hover:rotate-180 transition-transform duration-500"></i>
                                    <span className="font-bold text-sm tracking-wide">NEW PROJECT</span>
                                </button>
                            </div>
                        </header>

                        <div className="flex gap-2 mb-8 bg-slate-900/40 p-1 rounded-lg w-fit backdrop-blur-sm border border-white/5">
                            <button onClick={() => setFilter('all')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${filter === 'all' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>全部</button>
                            <button onClick={() => setFilter('active')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${filter === 'active' ? 'bg-accent text-white shadow-glow' : 'text-slate-400 hover:text-slate-200'}`}>進行中</button>
                            <button onClick={() => setFilter('completed')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${filter === 'completed' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>已完成</button>
                        </div>

                        <div className="animate-slide-up">
                            {filteredProjects.map(project => (
                                <ProjectCard 
                                    key={project.id} 
                                    project={project}
                                    onToggleTask={handleToggleTask}
                                    onDelete={handleOpenDelete}
                                    onEdit={handleOpenEdit}
                                    onQuickComplete={handleQuickComplete}
                                />
                            ))}

                            {filteredProjects.length === 0 && (
                                <div className="text-center py-24 border border-dashed border-slate-700 rounded-xl bg-slate-900/20">
                                    <div className="text-slate-600 text-5xl mb-4"><i className="fa-regular fa-clipboard"></i></div>
                                    <p className="text-slate-500">目前沒有專案，點擊右上角新增。</p>
                                </div>
                            )}
                        </div>
                    </div>

                    <AddProjectModal 
                        isOpen={isModalOpen} 
                        onClose={() => { setIsModalOpen(false); setEditingProject(null); }} 
                        onSave={handleSaveProject}
                        projectToEdit={editingProject}
                    />
                    
                    <ReportModal 
                        isOpen={isReportModalOpen} 
                        onClose={() => setIsReportModalOpen(false)} 
                        projects={projects}
                    />

                    <ConfirmModal 
                        isOpen={deleteModalOpen}
                        onClose={() => setDeleteModalOpen(false)}
                        onConfirm={handleConfirmDelete}
                        message="確定要刪除此專案嗎？此動作無法復原。"
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
