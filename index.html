<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kevin Yang 工作進度</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase Import Map -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js"
            }
        }
    </script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: { sans: ['Inter', 'Microsoft JhengHei', 'sans-serif'] },
                extend: {
                    colors: {
                        bgDark: '#0f172a',
                        glass: 'rgba(30, 41, 59, 0.85)',
                        accent: '#3b82f6',
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(59, 130, 246, 0.4)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .glass-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .glass-input:focus { background: rgba(15, 23, 42, 0.9); border-color: #3b82f6; outline: none; }
        .custom-checkbox { appearance: none; background-color: rgba(255,255,255,0.05); width: 1.2em; height: 1.2em; border: 1px solid rgba(255,255,255,0.3); border-radius: 0.25em; display: grid; place-content: center; cursor: pointer; }
        .custom-checkbox::before { content: ""; width: 0.65em; height: 0.65em; transform: scale(0); transition: 120ms transform ease-in-out; box-shadow: inset 1em 1em white; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
        .custom-checkbox:checked { background-color: #3b82f6; border-color: #3b82f6; }
        .custom-checkbox:checked::before { transform: scale(1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut, signInWithCustomToken } from "firebase/auth";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc } from "firebase/firestore";
        import { getAnalytics } from "firebase/analytics";

        // CONFIG: Using your provided Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDKNyqJCEbI5uCSUc4ws7dKuyBZA2lRaOA",
            authDomain: "kevinwork-eb7cc.firebaseapp.com",
            databaseURL: "https://kevinwork-eb7cc-default-rtdb.firebaseio.com",
            projectId: "kevinwork-eb7cc",
            storageBucket: "kevinwork-eb7cc.firebasestorage.app",
            messagingSenderId: "462117666080",
            appId: "1:462117666080:web:4289c00cc5144f98f6eb45",
            measurementId: "G-2DRK1D06QE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // FIXED ID: Ensures syncing across all devices
        const appId = 'kevin-dashboard-final-v2';

        window.db = db;
        window.auth = auth;
        window.firebaseAppId = appId;
        window.signInWithPopup = signInWithPopup;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
        window.collection = collection;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
        window.signInWithCustomToken = signInWithCustomToken;
        window.query = query;
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // ⚠️ 請在這裡填入從 aistudio.google.com 申請的免費金鑰，不要使用 Firebase 的 Key
        const apiKey = ""; 

        const downloadICS = (project) => {
            const formatDate = (d) => d.replace(/-/g, '');
            const getNextDay = (d) => { if(!d) return ''; const date = new Date(d); date.setDate(date.getDate() + 1); return date.toISOString().split('T')[0].replace(/-/g, ''); };
            
            let desc = `備註: ${project.notes || '無'}\\n\\n子任務:\\n`;
            (project.subtasks || []).forEach(t => desc += `${t.completed ? '[v]' : '[ ]'} ${t.text}\\n`);

            const content = [
                'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kevin Dashboard//ZH', 'BEGIN:VEVENT',
                `UID:${project.id}-${Date.now()}`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
                `DTSTART;VALUE=DATE:${formatDate(project.startDate)}`, `DTEND;VALUE=DATE:${getNextDay(project.deadline)}`,
                `SUMMARY:[${project.category}] ${project.title}`, `DESCRIPTION:${desc}`, 'END:VEVENT', 'END:VCALENDAR'
            ].join('\r\n');

            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([content], { type: 'text/calendar;charset=utf-8' }));
            link.setAttribute('download', `${project.title}.ics`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        // --- Components ---

        const LoginScreen = ({ onLogin, onGuest }) => (
            <div className="min-h-screen flex items-center justify-center p-4 relative">
                <div className="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
                    <div className="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[128px]"></div>
                    <div className="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-purple-600/15 rounded-full blur-[128px]"></div>
                </div>
                <div className="glass-panel w-full max-w-sm p-8 rounded-2xl shadow-2xl text-center border border-white/10 z-10 animate-fade-in">
                    <div className="mb-8">
                        <div className="w-16 h-16 bg-accent/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-accent/30 shadow-glow">
                            <i className="fa-solid fa-layer-group text-2xl text-accent"></i>
                        </div>
                        <h1 className="text-2xl font-black italic text-white mb-2">Kevin Yang</h1>
                        <p className="text-slate-400 text-xs">專案進度管理</p>
                    </div>
                    <div className="space-y-3">
                        <button onClick={onLogin} className="w-full bg-white text-slate-900 font-bold py-3 px-4 rounded-xl hover:bg-slate-100 flex items-center justify-center gap-3 transition-transform active:scale-95">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5" alt="G" /> Google 登入
                        </button>
                        <div className="relative py-2"><div className="border-t border-slate-700"></div><span className="absolute top-0 left-1/2 -translate-x-1/2 bg-[#1e293b] px-2 text-xs text-slate-500 mt-1">或</span></div>
                        <button onClick={onGuest} className="w-full bg-slate-800/50 text-slate-300 font-medium py-3 px-4 rounded-xl hover:bg-slate-800 border border-slate-700 transition-transform active:scale-95">訪客模式</button>
                    </div>
                </div>
            </div>
        );

        const ConfirmModal = ({ isOpen, onClose, onConfirm, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-xs glass-panel rounded-xl p-6 text-center border border-white/10 shadow-2xl animate-fade-in">
                        <i className="fa-solid fa-triangle-exclamation text-3xl text-red-400 mb-3 block"></i>
                        <h3 className="text-lg font-bold text-white mb-2">確認刪除</h3>
                        <p className="text-slate-300 text-xs mb-5">{message}</p>
                        <div className="flex gap-2">
                            <button onClick={onClose} className="flex-1 py-2 rounded-lg text-slate-300 bg-slate-700/50 text-xs">取消</button>
                            <button onClick={onConfirm} className="flex-1 py-2 rounded-lg text-white bg-red-500 font-bold text-xs shadow-lg">確定</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ReportModal = ({ isOpen, onClose, projects }) => {
            if (!isOpen) return null;
            const [dateRange, setDateRange] = useState({ start: '', end: '' });

            useEffect(() => {
                if(isOpen) {
                    const now = new Date();
                    setDateRange({ 
                        start: new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0],
                        end: new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0]
                    });
                }
            }, [isOpen]);

            const filteredData = useMemo(() => {
                if (!dateRange.start || !dateRange.end) return [];
                return projects.filter(p => p.startDate <= dateRange.end && p.deadline >= dateRange.start);
            }, [projects, dateRange]);

            const getStatus = (p) => {
                const t = p.subtasks?.length || 0;
                const c = p.subtasks?.filter(x => x.completed).length || 0;
                return (t > 0 && t === c) ? '已完成' : '進行中';
            };

            const exportCSV = () => {
                let csv = "\uFEFF專案,類別,開始,結束,狀態,進度\n";
                filteredData.forEach(p => {
                    const prog = p.subtasks?.length > 0 ? Math.round((p.subtasks.filter(x => x.completed).length / p.subtasks.length) * 100) + '%' : '0%';
                    csv += `"${p.title}","${p.category}","${p.startDate}","${p.deadline}","${getStatus(p)}","${prog}"\n`;
                });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
                link.setAttribute("download", `Report.csv`);
                document.body.appendChild(link).click();
                document.body.removeChild(link);
            };

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-3xl glass-panel rounded-2xl shadow-2xl flex flex-col max-h-[85vh] animate-fade-in mx-2">
                        <div className="px-4 py-3 border-b border-white/10 flex justify-between items-center">
                            <h2 className="text-base font-bold text-white flex items-center"><i className="fa-solid fa-chart-pie text-accent mr-2"></i>報表</h2>
                            <button onClick={onClose}><i className="fa-solid fa-times text-slate-400"></i></button>
                        </div>
                        <div className="p-4 grid grid-cols-2 gap-3">
                            <input type="date" className="glass-input p-2 rounded text-xs" value={dateRange.start} onChange={e => setDateRange({...dateRange, start: e.target.value})} />
                            <input type="date" className="glass-input p-2 rounded text-xs" value={dateRange.end} onChange={e => setDateRange({...dateRange, end: e.target.value})} />
                        </div>
                        <div className="flex-grow overflow-auto p-4 custom-scrollbar">
                            <table className="w-full text-left border-collapse min-w-[300px]">
                                <thead><tr className="text-xs text-slate-400 border-b border-white/10"><th className="pb-2">專案</th><th className="pb-2">狀態</th></tr></thead>
                                <tbody className="text-xs">
                                    {filteredData.map(p => (
                                        <tr key={p.id} className="border-b border-white/5">
                                            <td className="py-2 text-white">{p.title}</td>
                                            <td className="py-2"><span className={`px-1.5 py-0.5 rounded ${getStatus(p) === '已完成' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>{getStatus(p)}</span></td>
                                        </tr>
                                    ))}
                                    {filteredData.length === 0 && <tr><td colSpan="2" className="py-4 text-center text-slate-500">無資料</td></tr>}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-4 border-t border-white/10 flex justify-end gap-2">
                            <button onClick={onClose} className="px-3 py-1.5 rounded text-xs text-slate-300 bg-slate-700/50">關閉</button>
                            <button onClick={exportCSV} disabled={filteredData.length===0} className="px-3 py-1.5 rounded text-xs bg-emerald-600 text-white shadow-lg disabled:opacity-50">匯出 CSV</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectCard = ({ project, onToggleTask, onDelete, onEdit, onQuickComplete }) => {
            const [expanded, setExpanded] = useState(false);
            const total = project.subtasks?.length || 0;
            const completed = project.subtasks?.filter(t => t.completed).length || 0;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            // Safe date calculation
            const daysLeft = useMemo(() => {
                if (!project.deadline) return 0;
                const diff = new Date(project.deadline) - new Date();
                return Math.ceil(diff / (1000 * 60 * 60 * 24));
            }, [project.deadline]);

            return (
                <div className={`glass-panel rounded-xl mb-3 transition-all duration-300 overflow-hidden ${expanded ? 'bg-slate-800/80 ring-1 ring-white/10' : ''}`}>
                    <div className="p-4 flex flex-col gap-3 cursor-pointer" onClick={() => setExpanded(!expanded)}>
                        <div className="flex justify-between items-start">
                            <div className="flex items-center gap-3">
                                <div className="relative w-10 h-10 flex items-center justify-center">
                                    <svg className="w-full h-full -rotate-90"><circle className="text-slate-700" strokeWidth="3" fill="none" r="18" cx="20" cy="20"/><circle className="text-accent" strokeWidth="3" strokeDasharray={113} strokeDashoffset={113 - (percentage/100)*113} fill="none" r="18" cx="20" cy="20"/></svg>
                                    <span className="absolute text-[10px] font-bold text-white">{percentage}%</span>
                                </div>
                                <div>
                                    <div className="flex items-center gap-2 mb-0.5">
                                        <span className="px-1.5 py-0.5 rounded text-[10px] border border-white/20 text-slate-300 bg-white/5">{project.category}</span>
                                        <span className="text-[10px] text-slate-400">{project.deadline}</span>
                                    </div>
                                    <h3 className="text-base font-bold text-white leading-tight">{project.title}</h3>
                                </div>
                            </div>
                            <div className={`text-right ${daysLeft < 0 ? 'text-red-500' : 'text-slate-400'}`}>
                                <div className="text-lg font-bold leading-none">{Math.abs(daysLeft)}</div>
                                <div className="text-[9px] uppercase">Days</div>
                            </div>
                        </div>
                        <div className="flex justify-between items-center pt-2 border-t border-white/5">
                            <div className="flex gap-2">
                                <button onClick={(e) => { e.stopPropagation(); onQuickComplete(project); }} className="w-7 h-7 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center"><i className="fa-solid fa-check text-xs"></i></button>
                                <button onClick={(e) => { e.stopPropagation(); onDelete(project.id); }} className="w-7 h-7 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center"><i className="fa-solid fa-trash text-xs"></i></button>
                            </div>
                            <i className={`fa-solid fa-chevron-down text-xs text-slate-500 transition-transform ${expanded ? 'rotate-180' : ''}`}></i>
                        </div>
                    </div>
                    {expanded && (
                        <div className="p-4 pt-0 border-t border-white/5 bg-black/20">
                            <div className="py-3 space-y-2">
                                {(project.subtasks || []).map(t => (
                                    <div key={t.id} className="flex items-start gap-3">
                                        <input type="checkbox" checked={t.completed} onChange={() => onToggleTask(project, t.id)} className="custom-checkbox mt-1" />
                                        <span className={`text-sm ${t.completed ? 'text-slate-500 line-through' : 'text-slate-200'}`}>{t.text}</span>
                                    </div>
                                ))}
                                {(!project.subtasks || project.subtasks.length === 0) && <div className="text-xs text-slate-500 italic">無子任務</div>}
                            </div>
                            <div className="mt-2 pt-3 border-t border-white/5 grid grid-cols-2 gap-2 text-xs">
                                <div><span className="text-slate-500 block mb-1">備註</span><p className="text-slate-300">{project.notes || '無'}</p></div>
                                <div className="flex flex-col gap-2 justify-end">
                                    <button onClick={() => downloadICS(project)} className="py-1.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-center">匯出 ICS</button>
                                    <button onClick={() => onEdit(project)} className="py-1.5 rounded bg-slate-700/50 text-slate-300 text-center">編輯</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AddProjectModal = ({ isOpen, onClose, onSave, projectToEdit }) => {
            if (!isOpen) return null;
            const [form, setForm] = useState({ title: '', category: '社群官網', startDate: '', deadline: '', notes: '', subtasks: [{ id: Date.now(), text: '', completed: false }] });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const subtaskRef = useRef([]);

            useEffect(() => {
                if (isOpen) {
                    setForm(projectToEdit || { title: '', category: '社群官網', startDate: '', deadline: '', notes: '', subtasks: [{ id: Date.now(), text: '', completed: false }] });
                    setError('');
                }
            }, [isOpen, projectToEdit]);

            const handleAI = async () => {
                if (!apiKey) { setError('請先在程式碼中設定 API Key'); return; }
                if (!form.title) { setError('請輸入名稱'); return; }
                setLoading(true); setError('');
                try {
                    // Smart model switching: Use faster 'gemini-1.5-flash' for real use (localhost/file), 'preview' for sandbox
                    const isLocal = window.location.hostname === 'localhost' || window.location.protocol === 'file:';
                    const model = isLocal ? 'gemini-1.5-flash' : 'gemini-2.5-flash-preview-09-2025';
                    
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Generate JSON for project '${form.title}': {"category": "One of ['社群官網', '設計', '數位廣告', '展覽', '影片']", "description": "Trad. Chinese summary", "subtasks": [{"text": "Task1", "completed": false}], "notes": "Trad. Chinese notes"}. Clean JSON only.` }] }] })
                    });
                    
                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.error?.message || 'API Error');
                    }
                    
                    const data = await res.json();
                    const jsonStr = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                    const json = JSON.parse(jsonStr);
                    setForm(p => ({ ...p, category: json.category||p.category, notes: json.notes||json.description||p.notes, subtasks: json.subtasks?.map((t,i)=>({id:Date.now()+i, text:t.text, completed:false}))||p.subtasks }));
                } catch (e) { setError('生成失敗: ' + e.message); } finally { setLoading(false); }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-lg glass-panel rounded-2xl p-5 animate-fade-in flex flex-col max-h-[90vh]">
                        <div className="flex justify-between items-center mb-4 border-b border-white/10 pb-2">
                            <h3 className="text-white font-bold">{projectToEdit ? '編輯' : '新增'}</h3>
                            <button onClick={onClose}><i className="fa-solid fa-times text-slate-400"></i></button>
                        </div>
                        <div className="overflow-y-auto custom-scrollbar flex-1 space-y-4 pr-1">
                            {error && <div className="text-red-400 text-xs bg-red-500/10 p-2 rounded break-all">{error}</div>}
                            <div>
                                <div className="flex justify-between mb-1"><label className="text-xs text-slate-400">名稱</label><button onClick={handleAI} disabled={loading} className="text-xs text-accent"><i className={`fa-solid ${loading?'fa-spinner fa-spin':'fa-wand-magic-sparkles'}`}></i> AI 填寫</button></div>
                                <input className="glass-input w-full p-2 rounded" value={form.title} onChange={e=>setForm({...form, title:e.target.value})} />
                            </div>
                            <div>
                                <label className="text-xs text-slate-400">類別</label>
                                <select className="glass-input w-full p-2 rounded" value={form.category} onChange={e=>setForm({...form, category:e.target.value})}>
                                    {['社群官網','設計','數位廣告','展覽','影片'].map(c=><option key={c} value={c} className="bg-slate-900">{c}</option>)}
                                </select>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-xs text-slate-400">開始</label><input type="date" className="glass-input w-full p-2 rounded text-xs" value={form.startDate} onChange={e=>setForm({...form, startDate:e.target.value})} /></div>
                                <div><label className="text-xs text-slate-400">結束</label><input type="date" className="glass-input w-full p-2 rounded text-xs" value={form.deadline} onChange={e=>setForm({...form, deadline:e.target.value})} /></div>
                            </div>
                            <div>
                                <label className="text-xs text-slate-400 mb-1 block">子任務</label>
                                {form.subtasks.map((t, i) => (
                                    <div key={t.id} className="flex gap-2 mb-2">
                                        <input ref={el=>subtaskRef.current[i]=el} className="glass-input w-full p-2 rounded text-sm" value={t.text} onChange={e=>{const n=[...form.subtasks];n[i].text=e.target.value;setForm({...form,subtasks:n})}} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();setForm({...form,subtasks:[...form.subtasks,{id:Date.now(),text:'',completed:false}]})}}} />
                                        <button onClick={()=>setForm({...form,subtasks:form.subtasks.filter((_,idx)=>idx!==i)})} className="text-slate-500 hover:text-red-400"><i className="fa-solid fa-trash"></i></button>
                                    </div>
                                ))}
                                <button onClick={()=>setForm({...form,subtasks:[...form.subtasks,{id:Date.now(),text:'',completed:false}]})} className="text-xs text-accent"><i className="fa-solid fa-plus"></i> 新增</button>
                            </div>
                            <div>
                                <label className="text-xs text-slate-400">備註</label>
                                <textarea className="glass-input w-full p-2 rounded h-20" value={form.notes} onChange={e=>setForm({...form, notes:e.target.value})}></textarea>
                            </div>
                        </div>
                        <div className="mt-4 pt-3 border-t border-white/10 flex justify-end gap-2">
                            <button onClick={onClose} className="px-4 py-2 rounded text-xs text-slate-300 bg-slate-700/50">取消</button>
                            <button onClick={()=>{onSave({...form, subtasks:form.subtasks.filter(t=>t.text)});onClose()}} className="px-4 py-2 rounded text-xs font-bold text-white bg-accent shadow-glow">儲存</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [projects, setProjects] = useState([]);
            const [ui, setUi] = useState({ modal:false, report:false, delete:false, editId:null, delId:null, filter:'all' });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // Initialize auth ONLY once
                window.onAuthStateChanged(window.auth, u => { setUser(u); setLoading(false); });
            }, []);

            useEffect(() => {
                if (!user) { setProjects([]); return; }
                const q = window.query(window.collection(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects'));
                return window.onSnapshot(q, s => setProjects(s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>b.createdAt-a.createdAt)), e => {
                    if (e.code === 'permission-denied') alert('⚠️ 請先設定 Firestore 安全規則！\n\n前往 Firebase Console -> Build -> Firestore -> Rules\n貼上規則: allow read, write: if request.auth != null;');
                });
            }, [user]);

            const actions = {
                save: async (data) => {
                    if (!user) return;
                    const ref = window.collection(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects');
                    if (ui.editId) await window.setDoc(window.doc(ref, ui.editId), { ...data, updatedAt: Date.now() }, { merge: true });
                    else await window.addDoc(ref, { ...data, createdAt: Date.now() });
                    setUi({...ui, modal:false, editId:null});
                },
                del: async () => {
                    setUi(prev => ({...prev, delete: false})); // Optimistic close
                    if (ui.delId && user) await window.deleteDoc(window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', ui.delId));
                },
                toggle: async (p, tid) => {
                    const subtasks = p.subtasks.map(t => t.id === tid ? { ...t, completed: !t.completed } : t);
                    await window.updateDoc(window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', p.id), { subtasks });
                },
                quick: async (p) => {
                    await window.updateDoc(window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', p.id), { subtasks: p.subtasks.map(t => ({...t, completed:true})) });
                }
            };

            const filtered = projects.filter(p => {
                const total = p.subtasks?.length||0, done = p.subtasks?.filter(t=>t.completed).length||0;
                return ui.filter==='all' ? true : ui.filter==='completed' ? (total>0 && total===done) : (total===0 || total!==done);
            });

            if (loading) return <div className="min-h-screen flex items-center justify-center text-white bg-bgDark">載入中...</div>;
            if (!user) return <LoginScreen onLogin={()=>window.signInWithPopup(window.auth, new window.GoogleAuthProvider())} onGuest={()=>window.signInAnonymously(window.auth)} />;

            return (
                <div className="min-h-screen pb-20 p-4">
                    <header className="flex justify-between items-center mb-6 max-w-xl mx-auto">
                        <div><h1 className="text-2xl font-black text-white italic">Kevin Yang</h1><p className="text-xs text-slate-400">{user.isAnonymous?'Guest':user.email} <button onClick={()=>window.signOut(window.auth)} className="text-red-400 ml-2">登出</button></p></div>
                        <div className="flex gap-2">
                            <button onClick={()=>setUi({...ui, report:true})} className="bg-slate-800 text-white p-2 rounded-lg text-xs"><i className="fa-solid fa-chart-line"></i></button>
                            <button onClick={()=>setUi({...ui, modal:true, editId:null})} className="bg-accent text-white px-4 py-2 rounded-lg text-xs font-bold shadow-glow"><i className="fa-solid fa-plus"></i></button>
                        </div>
                    </header>
                    <div className="flex gap-2 mb-4 overflow-x-auto max-w-xl mx-auto">
                        {['all','active','completed'].map(f=><button key={f} onClick={()=>setUi({...ui, filter:f})} className={`px-4 py-1.5 rounded-full text-xs whitespace-nowrap transition-all ${ui.filter===f?'bg-white text-bgDark font-bold':'bg-slate-800 text-slate-400'}`}>{f==='all'?'全部':f==='active'?'進行中':'已完成'}</button>)}
                    </div>
                    <div className="max-w-xl mx-auto pb-10">
                        {filtered.map(p => (
                            <ProjectCard key={p.id} project={p} onToggleTask={actions.toggle} onDelete={id=>setUi({...ui, delete:true, delId:id})} onEdit={p=>setUi({...ui, modal:true, editId:p.id})} onQuickComplete={actions.quick} />
                        ))}
                        {filtered.length===0 && <div className="text-center py-12 border border-dashed border-slate-700 rounded-xl text-slate-500 text-xs">無專案</div>}
                    </div>
                    <AddProjectModal isOpen={ui.modal} onClose={()=>setUi({...ui, modal:false})} onSave={actions.save} projectToEdit={projects.find(p=>p.id===ui.editId)} />
                    <ReportModal isOpen={ui.report} onClose={()=>setUi({...ui, report:false})} projects={projects} />
                    <ConfirmModal isOpen={ui.delete} onClose={()=>setUi({...ui, delete:false})} onConfirm={actions.del} message="確定刪除此專案？" />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
