<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kevin Yang 工作進度</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase Import Map -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js"
            }
        }
    </script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['Inter', 'Microsoft JhengHei', 'sans-serif'],
                },
                extend: {
                    colors: {
                        bgDark: '#0f172a',
                        glass: 'rgba(30, 41, 59, 0.7)',
                        glassHover: 'rgba(51, 65, 85, 0.8)',
                        accent: '#3b82f6',
                        accentGlow: 'rgba(59, 130, 246, 0.5)',
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(59, 130, 246, 0.4)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .custom-checkbox {
            appearance: none;
            background-color: rgba(255,255,255,0.05);
            margin: 0;
            font: inherit;
            width: 1.2em;
            height: 1.2em;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut, signInWithCustomToken } from "firebase/auth";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc } from "firebase/firestore";
        import { getAnalytics } from "firebase/analytics";

        // Config logic
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDKNyqJCEbI5uCSUc4ws7dKuyBZA2lRaOA",
            authDomain: "kevinwork-eb7cc.firebaseapp.com",
            databaseURL: "https://kevinwork-eb7cc-default-rtdb.firebaseio.com",
            projectId: "kevinwork-eb7cc",
            storageBucket: "kevinwork-eb7cc.firebasestorage.app",
            messagingSenderId: "462117666080",
            appId: "1:462117666080:web:4289c00cc5144f98f6eb45",
            measurementId: "G-2DRK1D06QE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // FIXED ID for syncing
        const appId = 'kevin-dashboard-pro-v1';

        window.db = db;
        window.auth = auth;
        window.firebaseAppId = appId;
        window.signInWithPopup = signInWithPopup;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
        window.collection = collection;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
        window.signInWithCustomToken = signInWithCustomToken;
        window.query = query;
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // ⚠️ 請填入您的 AI Studio Key (免費申請: aistudio.google.com)
        const apiKey = "AIzaSyAmxfrXSw-gvWy95cUcrSx6szR0L0O3mWg"; 

        // --- ICS Export ---
        const downloadICS = (project) => {
            const formatDate = (d) => d.replace(/-/g, '');
            const getNextDay = (d) => { if(!d) return ''; const date = new Date(d); date.setDate(date.getDate() + 1); return date.toISOString().split('T')[0].replace(/-/g, ''); };
            let desc = `備註: ${project.notes || '無'}\\n\\n子任務:\\n`;
            (project.subtasks || []).forEach(t => desc += `${t.completed ? '[v]' : '[ ]'} ${t.text}\\n`);
            const content = [
                'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kevin Dashboard//ZH', 'BEGIN:VEVENT',
                `UID:${project.id}-${Date.now()}`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
                `DTSTART;VALUE=DATE:${formatDate(project.startDate)}`, `DTEND;VALUE=DATE:${getNextDay(project.deadline)}`,
                `SUMMARY:[${project.category}] ${project.title}`, `DESCRIPTION:${desc}`, 'END:VEVENT', 'END:VCALENDAR'
            ].join('\r\n');
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([content], { type: 'text/calendar;charset=utf-8' }));
            link.setAttribute('download', `${project.title}.ics`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        // --- Components ---

        const LoginScreen = ({ onLogin, onGuest }) => (
            <div className="min-h-screen flex items-center justify-center p-4 relative">
                <div className="fixed top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[128px] pointer-events-none"></div>
                <div className="fixed bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-purple-600/15 rounded-full blur-[128px] pointer-events-none"></div>
                <div className="glass-panel w-full max-w-sm p-8 rounded-2xl shadow-glass text-center border border-white/10 z-10 animate-fade-in">
                    <div className="mb-8">
                        <div className="w-20 h-20 bg-accent/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-accent/30 shadow-glow">
                            <i className="fa-solid fa-layer-group text-3xl text-accent"></i>
                        </div>
                        <h1 className="text-3xl font-black italic tracking-tighter text-white mb-2">Kevin Yang</h1>
                        <p className="text-slate-400 text-sm">專案進度管理儀表板</p>
                    </div>
                    <div className="space-y-4">
                        <button onClick={onLogin} className="w-full bg-white text-slate-900 font-bold py-3 px-4 rounded-xl hover:bg-slate-100 flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5" alt="G" /> 使用 Google 帳號登入
                        </button>
                        <div className="relative py-2"><div className="border-t border-slate-700"></div><span className="absolute top-0 left-1/2 -translate-x-1/2 bg-[#0f172a] px-2 text-sm text-slate-500">或</span></div>
                        <button onClick={onGuest} className="w-full bg-slate-800/50 text-slate-300 font-medium py-3 px-4 rounded-xl hover:bg-slate-800 border border-slate-700 transition-all active:scale-95">訪客模式 (Guest)</button>
                    </div>
                </div>
            </div>
        );

        const ConfirmModal = ({ isOpen, onClose, onConfirm, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-sm glass-panel rounded-xl p-6 text-center border border-white/10 shadow-2xl animate-fade-in">
                        <i className="fa-solid fa-triangle-exclamation text-4xl text-red-400 mb-4 block"></i>
                        <h3 className="text-lg font-bold text-white mb-2">確認刪除</h3>
                        <div className="text-slate-300 text-sm mb-6">{message}</div>
                        <div className="flex justify-center gap-3">
                            <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm text-slate-300 bg-slate-700/50 hover:bg-slate-700 transition-all">取消</button>
                            <button onClick={onConfirm} className="px-5 py-2 rounded-lg text-sm font-bold text-white bg-red-500 hover:bg-red-600 shadow-lg transition-all">確定刪除</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ReportModal = ({ isOpen, onClose, projects }) => {
            if (!isOpen) return null;
            const [dateRange, setDateRange] = useState({ start: '', end: '' });

            useEffect(() => {
                if(isOpen) {
                    const now = new Date();
                    setDateRange({ 
                        start: new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0],
                        end: new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0]
                    });
                }
            }, [isOpen]);

            const filteredData = useMemo(() => {
                if (!dateRange.start || !dateRange.end) return [];
                return projects.filter(p => p.startDate <= dateRange.end && p.deadline >= dateRange.start);
            }, [projects, dateRange]);

            const getMonthDisplay = (start, end) => {
                const s = new Date(start); const e = new Date(end);
                return (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) ? `${s.getMonth() + 1}月` : `${s.getMonth() + 1}月 - ${e.getMonth() + 1}月`;
            };

            const getStatus = (p) => {
                const t = p.subtasks?.length || 0; const c = p.subtasks?.filter(x => x.completed).length || 0;
                return (t > 0 && t === c) ? '已完成' : '進行中';
            };

            const exportCSV = () => {
                let csv = "\uFEFF專案名稱,類別,開始日期,截止日期,執行月份,狀態,進度\n";
                filteredData.forEach(p => {
                    const prog = p.subtasks?.length > 0 ? Math.round((p.subtasks.filter(x => x.completed).length / p.subtasks.length) * 100) + '%' : '0%';
                    csv += `"${p.title}","${p.category}","${p.startDate}","${p.deadline}","${getMonthDisplay(p.startDate, p.deadline)}","${getStatus(p)}","${prog}"\n`;
                });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
                link.setAttribute("download", `Project_Report.csv`);
                document.body.appendChild(link).click(); document.body.removeChild(link);
            };

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-3xl glass-panel rounded-2xl shadow-2xl flex flex-col max-h-[90vh] animate-fade-in">
                        <div className="px-6 py-4 border-b border-white/10 bg-slate-800/50 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white tracking-wide"><i className="fa-solid fa-chart-pie text-accent mr-2"></i>專案時程報表</h2>
                            <button onClick={onClose}><i className="fa-solid fa-times text-slate-400 text-lg hover:text-white"></i></button>
                        </div>
                        <div className="p-4 sm:p-6 pb-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div><label className="block text-xs font-bold text-slate-400 uppercase mb-1">起始</label><input type="date" className="w-full glass-input px-3 py-2 rounded-lg text-sm" value={dateRange.start} onChange={e => setDateRange({...dateRange, start: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-400 uppercase mb-1">結束</label><input type="date" className="w-full glass-input px-3 py-2 rounded-lg text-sm" value={dateRange.end} onChange={e => setDateRange({...dateRange, end: e.target.value})} /></div>
                        </div>
                        <div className="flex-grow overflow-auto p-4 sm:p-6 custom-scrollbar">
                            <table className="w-full text-left border-collapse">
                                <thead><tr className="text-xs text-slate-400 uppercase border-b border-white/10"><th className="pb-3 pl-2">專案名稱</th><th className="pb-3">類別</th><th className="pb-3">月份</th><th className="pb-3">狀態</th></tr></thead>
                                <tbody className="text-sm">
                                    {filteredData.map(p => (
                                        <tr key={p.id} className="border-b border-white/5 hover:bg-white/5 transition-colors">
                                            <td className="py-3 pl-2 font-medium text-white">{p.title}</td>
                                            <td className="py-3 text-slate-300">{p.category}</td>
                                            <td className="py-3 text-slate-300 font-mono">{getMonthDisplay(p.startDate, p.deadline)}</td>
                                            <td className="py-3"><span className={`px-2 py-1 rounded text-xs font-bold ${getStatus(p) === '已完成' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>{getStatus(p)}</span></td>
                                        </tr>
                                    ))}
                                    {filteredData.length === 0 && <tr><td colSpan="4" className="text-center py-8 text-slate-500 italic">無資料</td></tr>}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-4 border-t border-white/10 bg-slate-800/50 flex justify-end gap-3">
                            <button onClick={onClose} className="px-5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white bg-slate-700/30">關閉</button>
                            <button onClick={exportCSV} disabled={filteredData.length===0} className="px-5 py-2 rounded-lg text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 shadow-lg disabled:opacity-50 flex items-center gap-2"><i className="fa-solid fa-file-csv"></i> 匯出 CSV</button>
                        </div>
                    </div>
                </div>
            );
        };

        const CircularProgress = ({ percentage, size = 60, strokeWidth = 5 }) => {
            const radius = (size - strokeWidth) / 2; const circumference = radius * 2 * Math.PI; const offset = circumference - (percentage / 100) * circumference;
            return (
                <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
                    <svg className="transform -rotate-90 w-full h-full">
                        <circle className="text-slate-700" strokeWidth={strokeWidth} stroke="currentColor" fill="transparent" r={radius} cx={size / 2} cy={size / 2} />
                        <circle className="text-accent transition-all duration-1000 ease-out" strokeWidth={strokeWidth} strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round" stroke="currentColor" fill="transparent" r={radius} cx={size / 2} cy={size / 2} />
                    </svg>
                    <span className="absolute text-xs font-bold text-white">{percentage}%</span>
                </div>
            );
        };

        const Badge = ({ category }) => {
            const getColors = (cat) => {
                switch(cat) {
                    case "社群官網": return "bg-cyan-500/10 text-cyan-400 border-cyan-500/30";
                    case "設計": return "bg-pink-500/10 text-pink-400 border-pink-500/30";
                    case "數位廣告": return "bg-purple-500/10 text-purple-400 border-purple-500/30";
                    case "展覽": return "bg-amber-500/10 text-amber-400 border-amber-500/30";
                    case "影片": return "bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
                    default: return "bg-slate-500/10 text-slate-400 border-slate-500/30";
                }
            };
            return <span className={`px-2.5 py-0.5 rounded text-[11px] font-medium border tracking-wide ${getColors(category)}`}>{category}</span>;
        };

        const ProjectCard = ({ project, onToggleTask, onDelete, onEdit, onQuickComplete }) => {
            const [expanded, setExpanded] = useState(false);
            const total = project.subtasks?.length || 0;
            const completed = project.subtasks?.filter(t => t.completed).length || 0;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            const isAllCompleted = total > 0 && total === completed;
            
            const daysLeft = useMemo(() => {
                if (!project.deadline) return 0;
                const diff = new Date(project.deadline) - new Date();
                return Math.ceil(diff / (1000 * 60 * 60 * 24));
            }, [project.deadline]);

            return (
                <div className={`glass-panel rounded-xl mb-5 transition-all duration-300 group overflow-hidden ${expanded ? 'bg-slate-800/80 ring-1 ring-white/10' : 'hover:bg-slate-800/40'}`}>
                    {/* Mobile optimized layout: flex-col on mobile, flex-row on desktop */}
                    <div className="p-5 flex flex-col sm:flex-row sm:items-center justify-between cursor-pointer relative gap-4 sm:gap-0" onClick={() => setExpanded(!expanded)}>
                        
                        {/* Title Section */}
                        <div className="flex items-center gap-5 w-full sm:w-auto">
                            <div className="flex-shrink-0"><CircularProgress percentage={percentage} size={56} strokeWidth={4} /></div>
                            <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-3 mb-1">
                                    <Badge category={project.category} />
                                    <span className="text-xs text-slate-400 font-mono tracking-wide">{project.deadline}</span>
                                </div>
                                <h3 className="text-xl font-bold text-white group-hover:text-accent transition-colors tracking-tight truncate">{project.title}</h3>
                            </div>
                        </div>

                        {/* Actions & Stats - Border top on mobile for separation */}
                        <div className="flex items-center justify-between sm:justify-end gap-4 w-full sm:w-auto pt-3 sm:pt-0 border-t border-white/5 sm:border-0">
                            {/* Quick Actions: Always visible on mobile, hover on desktop */}
                            <div className="flex items-center gap-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-all duration-300 sm:transform sm:translate-x-2 sm:group-hover:translate-x-0">
                                <button onClick={(e) => { e.stopPropagation(); onQuickComplete(project); }} className={`w-9 h-9 rounded-full flex items-center justify-center transition-all shadow-lg active:scale-95 ${isAllCompleted ? 'bg-yellow-500/20 text-yellow-400 hover:bg-yellow-500 hover:text-white border border-yellow-500/30' : 'bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500 hover:text-white border border-emerald-500/20 hover:shadow-emerald-500/30'}`} title={isAllCompleted ? "取消完成" : "全部完成"}>
                                    <i className={`fa-solid ${isAllCompleted ? 'fa-rotate-left' : 'fa-check'}`}></i>
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); onDelete(project.id); }} className="w-9 h-9 rounded-full bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/20 flex items-center justify-center transition-all shadow-lg hover:shadow-red-500/30" title="快速刪除"><i className="fa-solid fa-trash"></i></button>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className={`flex flex-col items-end ${daysLeft < 0 ? 'text-red-500' : daysLeft===0 ? 'text-amber-400' : 'text-slate-300'}`}>
                                    <span className="text-2xl font-bold leading-none">{Math.abs(daysLeft)}</span>
                                    <span className="text-[10px] uppercase tracking-wider opacity-70 font-bold">{daysLeft < 0 ? 'OVERDUE' : daysLeft===0 ? 'DUE TODAY' : 'DAYS LEFT'}</span>
                                </div>
                                <div className={`w-8 h-8 rounded-full flex items-center justify-center transition-transform duration-300 ${expanded ? 'rotate-180 bg-slate-700' : 'bg-transparent'}`}><i className="fa-solid fa-chevron-down text-sm text-slate-400"></i></div>
                            </div>
                        </div>
                    </div>

                    <div className={`transition-all duration-500 ease-in-out overflow-hidden ${expanded ? 'max-h-[800px] opacity-100' : 'max-h-0 opacity-0'}`}>
                        <div className="p-6 pt-2 border-t border-white/5 grid grid-cols-1 md:grid-cols-12 gap-8">
                            <div className="md:col-span-7">
                                <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Subtasks</h4>
                                <div className="space-y-3">
                                    {project.subtasks && project.subtasks.map(task => (
                                        <div key={task.id} className="flex items-start gap-3">
                                            <input type="checkbox" checked={task.completed} onChange={() => onToggleTask(project, task.id)} className="custom-checkbox mt-0.5 flex-shrink-0" />
                                            <span className={`text-sm leading-relaxed transition-all ${task.completed ? 'text-slate-500 line-through decoration-slate-600' : 'text-slate-200'}`}>{task.text}</span>
                                        </div>
                                    ))}
                                    {(!project.subtasks || project.subtasks.length === 0) && <p className="text-slate-500 italic text-sm">無子任務</p>}
                                </div>
                            </div>
                            <div className="md:col-span-5 flex flex-col h-full bg-slate-900/30 rounded-lg p-4 border border-white/5">
                                <div className="flex-grow">
                                    <div className="mb-4">
                                        <h4 className="text-[10px] font-bold text-slate-500 uppercase mb-1">Schedule</h4>
                                        <div className="flex justify-between text-sm text-slate-300 font-mono bg-slate-800/50 p-2 rounded border border-white/5"><span>{project.startDate}</span><span className="text-slate-600">to</span><span>{project.deadline}</span></div>
                                    </div>
                                    <div><h4 className="text-[10px] font-bold text-slate-500 uppercase mb-1">Notes</h4><p className="text-sm text-slate-400 leading-relaxed min-h-[60px]">{project.notes || "無備註"}</p></div>
                                </div>
                                <div className="flex gap-2 mt-4 pt-4 border-t border-white/5">
                                    <button onClick={() => downloadICS(project)} className="flex-1 py-1.5 rounded bg-indigo-500/20 hover:bg-indigo-500/40 text-xs text-indigo-300 border border-indigo-500/30 transition-colors flex items-center justify-center gap-1.5"><i className="fa-solid fa-calendar-alt"></i> 行事曆</button>
                                    <button onClick={() => onEdit(project)} className="flex-1 py-1.5 rounded bg-slate-700/50 hover:bg-slate-700 text-xs text-slate-300 transition-colors">編輯</button>
                                    <button onClick={() => onDelete(project.id)} className="flex-1 py-1.5 rounded bg-red-500/10 hover:bg-red-500/20 text-xs text-red-400 border border-red-500/20 transition-colors">刪除</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AddProjectModal = ({ isOpen, onClose, onSave, projectToEdit }) => {
            if (!isOpen) return null;
            const defaultFormState = { title: '', category: '社群官網', startDate: '', deadline: '', notes: '', subtasks: [{ id: Date.now(), text: '', completed: false }] };
            const [form, setForm] = useState(defaultFormState);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const subtaskRef = useRef([]);
            // 新增：用來記錄上一次子任務數量的 ref
            const prevSubtaskCount = useRef(0);

            useEffect(() => {
                if (isOpen) {
                    const initForm = projectToEdit || { title: '', category: '社群官網', startDate: '', deadline: '', notes: '', subtasks: [{ id: Date.now(), text: '', completed: false }] };
                    setForm(initForm);
                    setError('');
                    // 初始化數量
                    prevSubtaskCount.current = initForm.subtasks.length;
                }
            }, [isOpen, projectToEdit]);

            // 新增：監聽子任務數量變化，若增加則聚焦最後一個輸入框
            useEffect(() => {
                if (form.subtasks.length > prevSubtaskCount.current) {
                    const lastIndex = form.subtasks.length - 1;
                    if (subtaskRef.current[lastIndex]) {
                        subtaskRef.current[lastIndex].focus();
                    }
                }
                prevSubtaskCount.current = form.subtasks.length;
            }, [form.subtasks.length]);

            const updateSubtask = (idx, val) => {
                const newTasks = [...form.subtasks];
                newTasks[idx].text = val;
                setForm({...form, subtasks: newTasks});
            };
            const addSubtaskRow = () => setForm({...form, subtasks: [...form.subtasks, { id: Date.now() + Math.random(), text: '', completed: false }]});
            const removeSubtaskRow = (idx) => setForm({...form, subtasks: form.subtasks.filter((_, i) => i !== idx)});

            const handleAI = async () => {
                if (!apiKey) { setError('請先在程式碼中設定 API Key'); return; }
                if (!form.title) { setError('請輸入名稱'); return; }
                setLoading(true); setError('');
                try {
                    const isLocal = window.location.hostname === 'localhost' || window.location.protocol === 'file:';
                    const model = isLocal ? 'gemini-1.5-flash' : 'gemini-2.5-flash-preview-09-2025';
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Generate JSON for project '${form.title}': {"category": "One of ['社群官網', '設計', '數位廣告', '展覽', '影片']", "description": "Trad. Chinese summary", "subtasks": [{"text": "Task1", "completed": false}], "notes": "Trad. Chinese notes"}. Clean JSON only.` }] }] })
                    });
                    if (!res.ok) { const err = await res.json(); throw new Error(err.error?.message || 'API Error'); }
                    const data = await res.json();
                    const json = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim());
                    setForm(p => ({ ...p, category: json.category||p.category, notes: json.notes||json.description||p.notes, subtasks: json.subtasks?.map((t,i)=>({id:Date.now()+i, text:t.text, completed:false}))||p.subtasks }));
                } catch (e) { setError('生成失敗: ' + e.message); } finally { setLoading(false); }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-2xl glass-panel rounded-2xl shadow-glass overflow-hidden animate-fade-in flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b border-white/10 bg-slate-800/50 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white tracking-wide">{projectToEdit ? '編輯專案' : '新專案'}</h2>
                            <button onClick={onClose}><i className="fa-solid fa-times text-slate-400 hover:text-white"></i></button>
                        </div>
                        <div className="overflow-y-auto p-4 sm:p-6 custom-scrollbar flex-1 space-y-5">
                            {error && <div className="text-red-400 text-sm bg-red-500/10 p-3 rounded border border-red-500/20">{error}</div>}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div className="md:col-span-2">
                                    <div className="flex justify-between mb-1"><label className="text-xs font-bold text-slate-400 uppercase">名稱</label><button onClick={handleAI} disabled={loading} className="text-xs text-accent"><i className={`fa-solid ${loading?'fa-spinner fa-spin':'fa-wand-magic-sparkles'}`}></i> AI 填寫</button></div>
                                    <input className="glass-input w-full px-4 py-2.5 rounded-lg" value={form.title} onChange={e=>setForm({...form, title:e.target.value})} placeholder="例如: 尾牙活動" />
                                </div>
                                <div><label className="text-xs font-bold text-slate-400 uppercase mb-1 block">類別</label><select className="glass-input w-full px-4 py-2.5 rounded-lg" value={form.category} onChange={e=>setForm({...form, category:e.target.value})}>{['社群官網','設計','數位廣告','展覽','影片'].map(c=><option key={c} value={c} className="bg-slate-900">{c}</option>)}</select></div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    <div><label className="text-xs font-bold text-slate-400 uppercase mb-1 block">開始</label><input type="date" className="glass-input w-full px-2 py-2.5 rounded-lg text-sm" value={form.startDate} onChange={e=>setForm({...form, startDate:e.target.value})} /></div>
                                    <div><label className="text-xs font-bold text-slate-400 uppercase mb-1 block">結束</label><input type="date" className="glass-input w-full px-2 py-2.5 rounded-lg text-sm" value={form.deadline} onChange={e=>setForm({...form, deadline:e.target.value})} /></div>
                                </div>
                                <div className="md:col-span-2">
                                    <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">子任務</label>
                                    <div className="space-y-2 mb-2">
                                        {form.subtasks.map((t, i) => (
                                            <div key={t.id} className="flex gap-2">
                                                <input ref={el=>subtaskRef.current[i]=el} className="glass-input flex-grow px-3 py-2 rounded text-sm" value={t.text} onChange={e=>{const n=[...form.subtasks];n[i].text=e.target.value;setForm({...form,subtasks:n})}} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addSubtaskRow();}}} placeholder="任務..." />
                                                <button onClick={()=>setForm({...form,subtasks:form.subtasks.filter((_,idx)=>idx!==i)})} className="text-slate-500 hover:text-red-400 px-2"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={addSubtaskRow} className="text-xs text-accent font-medium flex items-center gap-1"><i className="fa-solid fa-plus"></i> 新增任務</button>
                                </div>
                                <div className="md:col-span-2">
                                    <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">備註</label>
                                    <textarea className="glass-input w-full px-4 py-2.5 rounded-lg h-24 resize-none" value={form.notes} onChange={e=>setForm({...form, notes:e.target.value})}></textarea>
                                </div>
                            </div>
                        </div>
                        <div className="p-4 border-t border-white/10 bg-slate-800/50 flex justify-end gap-3 shrink-0">
                            <button onClick={onClose} className="px-5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white bg-white/5">取消</button>
                            <button onClick={()=>{onSave({...form, subtasks:form.subtasks.filter(t=>t.text)});onClose()}} className="px-6 py-2 rounded-lg text-sm font-bold text-white bg-accent shadow-glow hover:bg-blue-600 active:scale-95 transition-all">儲存</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [projects, setProjects] = useState([]);
            const [ui, setUi] = useState({ modal:false, report:false, delete:false, editId:null, delId:null, filter:'all' });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                window.onAuthStateChanged(window.auth, u => { setUser(u); setLoading(false); });
            }, []);

            useEffect(() => {
                if (!user) { setProjects([]); return; }
                const q = window.query(window.collection(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects'));
                return window.onSnapshot(q, s => setProjects(s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>b.createdAt-a.createdAt)), e => {
                    if (e.code === 'permission-denied') alert('⚠️ 請先設定 Firestore 安全規則！\n\n前往 Firebase Console -> Build -> Firestore -> Rules\n貼上規則: allow read, write: if request.auth != null;');
                });
            }, [user]);

            const actions = {
                save: async (data) => {
                    if (!user) return;
                    const ref = window.collection(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects');
                    if (ui.editId) await window.setDoc(window.doc(ref, ui.editId), { ...data, updatedAt: Date.now() }, { merge: true });
                    else await window.addDoc(ref, { ...data, createdAt: Date.now() });
                    setUi({...ui, modal:false, editId:null});
                },
                del: async () => {
                    setUi(prev => ({...prev, delete: false})); // Optimistic Close
                    if (ui.delId && user) await window.deleteDoc(window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', ui.delId));
                },
                toggle: async (p, tid) => {
                    const subtasks = p.subtasks.map(t => t.id === tid ? { ...t, completed: !t.completed } : t);
                    await window.updateDoc(window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', p.id), { subtasks });
                },
                quick: async (p) => {
                    // Check if all subtasks are complete
                    const allCompleted = p.subtasks.every(t => t.completed);
                    // Toggle logic: if all complete, reset to false; otherwise set all to true
                    const newStatus = !allCompleted;
                    
                    await window.updateDoc(window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', p.id), { 
                        subtasks: p.subtasks.map(t => ({...t, completed: newStatus})) 
                    });
                }
            };

            const filtered = projects.filter(p => {
                const total = p.subtasks?.length||0, done = p.subtasks?.filter(t=>t.completed).length||0;
                return ui.filter==='all' ? true : ui.filter==='completed' ? (total>0 && total===done) : (total===0 || total!==done);
            });

            if (loading) return <div className="min-h-screen flex items-center justify-center text-white bg-bgDark">載入中...</div>;
            if (!user) return <LoginScreen onLogin={()=>window.signInWithPopup(window.auth, new window.GoogleAuthProvider())} onGuest={()=>window.signInAnonymously(window.auth)} />;

            return (
                <div className="min-h-screen pb-20 relative">
                    <div className="fixed top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[128px] pointer-events-none"></div>
                    <div className="fixed bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-purple-600/15 rounded-full blur-[128px] pointer-events-none"></div>
                    
                    <div className="max-w-4xl mx-auto px-6 py-12 relative z-10">
                        <header className="flex flex-col md:flex-row md:items-end justify-between mb-8 pb-6 border-b border-white/5 gap-4">
                            <div>
                                <h1 className="text-3xl font-black italic tracking-tighter text-white mb-3">Kevin Yang <span className="text-slate-500 not-italic font-normal text-xl ml-2">工作進度</span></h1>
                                
                                {/* New User Badge UI */}
                                <div className="flex items-center gap-3">
                                    <div className="flex items-center bg-white/5 rounded-full pl-1.5 pr-2 py-1.5 border border-white/10 backdrop-blur-md transition-all hover:bg-white/10">
                                        <div className={`w-7 h-7 rounded-full flex items-center justify-center mr-2.5 shadow-lg ${user.isAnonymous ? 'bg-amber-500/20 text-amber-400 ring-1 ring-amber-500/30' : 'bg-accent/20 text-accent ring-1 ring-accent/30'}`}>
                                            <i className={`fa-solid ${user.isAnonymous ? 'fa-user-secret' : 'fa-user'} text-xs`}></i>
                                        </div>
                                        <div className="flex flex-col mr-3">
                                            <span className="text-[10px] text-slate-400 uppercase tracking-wider font-bold leading-none mb-0.5">{user.isAnonymous ? 'GUEST ACCESS' : 'LOGGED IN AS'}</span>
                                            <span className="text-xs text-white font-medium leading-none max-w-[150px] truncate">{user.isAnonymous ? '訪客模式' : user.email}</span>
                                        </div>
                                        <button 
                                            onClick={()=>window.signOut(window.auth)} 
                                            className="w-7 h-7 rounded-full bg-white/5 hover:bg-red-500/20 text-slate-400 hover:text-red-400 transition-all flex items-center justify-center border border-white/5"
                                            title="登出"
                                        >
                                            <i className="fa-solid fa-power-off text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-3">
                                <button onClick={()=>setUi({...ui, report:true})} className="group flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 px-5 py-3 rounded-lg transition-all shadow-lg active:scale-95"><i className="fa-solid fa-chart-line text-sm text-accent"></i> <span className="font-bold text-sm">報表與匯出</span></button>
                                <button onClick={()=>setUi({...ui, modal:true, editId:null})} className="group flex items-center gap-2 bg-accent/90 hover:bg-blue-500 text-white px-6 py-3 rounded-lg shadow-glow transition-all active:scale-95"><i className="fa-solid fa-plus text-sm group-hover:rotate-180 transition-transform"></i> <span className="font-bold text-sm">NEW PROJECT</span></button>
                            </div>
                        </header>
                        <div className="flex gap-2 mb-8 bg-slate-900/40 p-1 rounded-lg w-fit backdrop-blur-sm border border-white/5">
                            {['all','active','completed'].map(f=><button key={f} onClick={()=>setUi({...ui, filter:f})} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${ui.filter===f?'bg-slate-700 text-white shadow-sm':'text-slate-400 hover:text-slate-200'}`}>{f==='all'?'全部':f==='active'?'進行中':'已完成'}</button>)}
                        </div>
                        <div className="animate-slide-up">
                            {filtered.map(p => (
                                <ProjectCard key={p.id} project={p} onToggleTask={actions.toggle} onDelete={id=>setUi({...ui, delete:true, delId:id})} onEdit={p=>setUi({...ui, modal:true, editId:p.id})} onQuickComplete={actions.quick} />
                            ))}
                            {filtered.length===0 && <div className="text-center py-24 border border-dashed border-slate-700 rounded-xl bg-slate-900/20"><i className="fa-regular fa-clipboard text-5xl text-slate-600 mb-4"></i><p className="text-slate-500">此分類下沒有專案</p></div>}
                        </div>
                    </div>
                    <AddProjectModal isOpen={ui.modal} onClose={()=>setUi({...ui, modal:false})} onSave={actions.save} projectToEdit={projects.find(p=>p.id===ui.editId)} />
                    <ReportModal isOpen={ui.report} onClose={()=>setUi({...ui, report:false})} projects={projects} />
                    <ConfirmModal isOpen={ui.delete} onClose={()=>setUi({...ui, delete:false})} onConfirm={actions.del} message="確定要刪除此專案嗎？此動作無法復原。" />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
