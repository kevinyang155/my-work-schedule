<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin Yang 工作進度 - AI 強化版</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif; 
            background-color: #0f172a; 
            color: #f1f5f9;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neo-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .neo-button:hover {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .card-hover:hover {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(30, 41, 59, 0.9);
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* AI Loading Animation */
        .ai-glow {
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 5px -2px #6366f1; }
            to { box-shadow: 0 0 15px 2px #6366f1; }
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CATEGORIES = {
        '社群官網': 'border-cyan-500/50 text-cyan-400 bg-cyan-500/10',
        '設計': 'border-rose-500/50 text-rose-400 bg-rose-500/10',
        '數位廣告': 'border-indigo-500/50 text-indigo-400 bg-indigo-500/10',
        '展覽': 'border-amber-500/50 text-amber-400 bg-amber-500/10',
        '影片': 'border-emerald-500/50 text-emerald-400 bg-emerald-500/10',
        '其他': 'border-slate-500/50 text-slate-400 bg-slate-500/10'
    };

    // Gemini API 設定
    const apiKey = ""; 

    function App() {
        const STORAGE_KEY = 'myWorkScheduleDark_Original_V1';
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kevin-yang-work-schedule';
        
        const [projects, setProjects] = useState(() => {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : [];
        });
        const [filter, setFilter] = useState('all');
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [editingProject, setEditingProject] = useState(null);
        const [deleteTarget, setDeleteTarget] = useState(null);

        useEffect(() => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
        }, [projects]);

        const calculateProgress = (subTasks) => {
            if (!subTasks || subTasks.length === 0) return 0;
            const completed = subTasks.filter(t => t.done).length;
            return Math.round((completed / subTasks.length) * 100);
        };

        const getRemainingDays = (endDateStr) => {
            const today = new Date();
            today.setHours(0,0,0,0);
            const end = new Date(endDateStr);
            return Math.ceil((end - today) / (1000 * 60 * 60 * 24));
        };

        const saveProject = (projectData) => {
            if (editingProject) {
                setProjects(prev => prev.map(p => p.id === projectData.id ? projectData : p));
            } else {
                setProjects(prev => [{ ...projectData, id: Date.now() }, ...prev]);
            }
            setIsModalOpen(false);
            setEditingProject(null);
        };

        const executeDelete = () => {
            if (deleteTarget) {
                setProjects(prev => prev.filter(p => p.id !== deleteTarget.id));
                setDeleteTarget(null);
            }
        };

        const toggleSubtask = (pid, idx) => {
            setProjects(prev => prev.map(p => {
                if (p.id === pid) {
                    const newTasks = p.subTasks.map((t, i) => i === idx ? { ...t, done: !t.done } : t);
                    return { ...p, subTasks: newTasks };
                }
                return p;
            }));
        };

        const filteredProjects = useMemo(() => {
            let sorted = [...projects].sort((a, b) => new Date(a.endDate) - new Date(b.endDate));
            if (filter === 'completed') return sorted.filter(p => calculateProgress(p.subTasks) === 100);
            if (filter === 'active') return sorted.filter(p => calculateProgress(p.subTasks) < 100);
            return sorted;
        }, [projects, filter]);

        return (
            <div className="min-h-screen pb-20 px-4">
                <header className="max-w-5xl mx-auto pt-10 pb-8 flex flex-col md:flex-row justify-between items-center gap-6">
                    <h1 className="text-4xl font-extrabold tracking-tight text-white italic uppercase flex items-center">
                        <span className="bg-blue-600 w-2 h-10 rounded-full mr-4"></span>
                        Kevin Yang 工作進度
                    </h1>
                    <button 
                        onClick={() => { setEditingProject(null); setIsModalOpen(true); }}
                        className="neo-button bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg"
                    >
                        + NEW PROJECT
                    </button>
                </header>

                <main className="max-w-5xl mx-auto">
                    <div className="flex space-x-2 mb-8 bg-slate-800/50 p-1.5 rounded-2xl w-fit">
                        {['all', 'active', 'completed'].map(f => (
                            <button key={f} onClick={() => setFilter(f)}
                                className={`px-6 py-2 rounded-xl text-sm font-semibold transition-all ${filter === f ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}`}>
                                {f === 'all' ? '全部' : f === 'active' ? '進行中' : '已完成'}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 gap-4">
                        {filteredProjects.map(p => (
                            <ProjectCard 
                                key={p.id} project={p} 
                                onEdit={() => { setEditingProject(p); setIsModalOpen(true); }}
                                onDelete={() => setDeleteTarget(p)}
                                onToggle={toggleSubtask}
                                calc={calculateProgress}
                                rem={getRemainingDays}
                            />
                        ))}
                    </div>
                </main>

                {isModalOpen && <ProjectModal project={editingProject} onSave={saveProject} onClose={() => setIsModalOpen(false)} />}
                
                {deleteTarget && (
                    <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                        <div className="glass-panel w-full max-w-sm rounded-3xl p-8 text-center">
                            <i className="fas fa-trash-alt text-rose-500 text-3xl mb-4"></i>
                            <h3 className="text-xl font-bold mb-2 text-white">確認刪除專案？</h3>
                            <p className="text-slate-400 text-sm mb-8">「{deleteTarget.name}」將會被永久刪除。</p>
                            <div className="flex gap-3">
                                <button onClick={() => setDeleteTarget(null)} className="flex-1 py-3 rounded-xl bg-slate-800 font-bold">取消</button>
                                <button onClick={executeDelete} className="flex-1 py-3 rounded-xl bg-rose-600 font-bold text-white shadow-lg">確認</button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    function ProjectCard({ project, onEdit, onDelete, onToggle, calc, rem }) {
        const [isExp, setIsExp] = useState(false);
        const progress = calc(project.subTasks);
        const days = rem(project.endDate);

        return (
            <div className={`glass-panel rounded-3xl overflow-hidden card-hover transition-all ${isExp ? 'ring-1 ring-blue-500/30 shadow-2xl' : ''}`}>
                <div className="p-5 flex items-center justify-between cursor-pointer" onClick={() => setIsExp(!isExp)}>
                    <div className="flex items-center gap-6 flex-1 min-w-0">
                        <div className="relative w-12 h-12 shrink-0">
                            <svg className="w-full h-full transform -rotate-90">
                                <circle cx="24" cy="24" r="20" stroke="currentColor" strokeWidth="4" fill="transparent" className="text-slate-700"/>
                                <circle cx="24" cy="24" r="20" stroke="currentColor" strokeWidth="4" fill="transparent" 
                                    strokeDasharray={125.6} strokeDashoffset={125.6 - (125.6 * progress) / 100}
                                    className={`${progress === 100 ? 'text-emerald-400' : 'text-blue-500'} transition-all duration-700`}
                                />
                            </svg>
                            <span className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white">{progress}%</span>
                        </div>
                        <div className="min-w-0 flex-1">
                            <div className="flex items-center gap-3 mb-1">
                                <span className={`shrink-0 border px-2 py-0.5 rounded-lg text-[10px] font-bold ${CATEGORIES[project.category]}`}>{project.category}</span>
                                <h3 className="text-lg font-bold truncate text-white uppercase">{project.name}</h3>
                            </div>
                            <div className="flex gap-4 text-xs text-slate-400">
                                <span>截止 {project.endDate}</span>
                                <span className={days <= 3 && progress < 100 ? 'text-rose-400 font-bold' : ''}>
                                    {days < 0 ? `逾期 ${Math.abs(days)}` : days === 0 ? '今天截止' : `剩餘 ${days} 天`}
                                </span>
                            </div>
                        </div>
                    </div>
                    <i className={`fas fa-chevron-right text-slate-600 transition-transform ${isExp ? 'rotate-90' : ''}`}></i>
                </div>

                {isExp && (
                    <div className="px-6 pb-6 pt-2">
                        <div className="h-px bg-slate-700/50 mb-6"></div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div>
                                <h4 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">子任務</h4>
                                <div className="space-y-2">
                                    {project.subTasks.map((t, i) => (
                                        <label key={i} className="flex items-center gap-4 bg-slate-800/30 p-3 rounded-2xl cursor-pointer">
                                            <input type="checkbox" checked={t.done} onChange={() => onToggle(project.id, i)} className="w-5 h-5 rounded border-2 border-slate-600 checked:bg-blue-600" />
                                            <span className={`text-sm ${t.done ? 'text-slate-500 line-through' : 'text-slate-200'}`}>{t.text}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                            <div className="space-y-6">
                                <div>
                                    <h4 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">備註</h4>
                                    <div className="bg-slate-800/50 p-4 rounded-2xl text-sm text-slate-300 min-h-[80px] whitespace-pre-wrap border border-slate-700">{project.notes || '無'}</div>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={(e) => { e.stopPropagation(); onEdit(); }} className="flex-1 bg-slate-700 py-3 rounded-xl text-xs font-bold hover:bg-slate-600">編輯</button>
                                    <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="w-12 h-12 bg-rose-600/20 text-rose-500 rounded-xl hover:bg-rose-600 hover:text-white transition-all"><i className="fas fa-trash-alt"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    function ProjectModal({ project, onSave, onClose }) {
        const [form, setForm] = useState(project || {
            category: '社群官網', name: '', startDate: new Date().toISOString().split('T')[0],
            endDate: new Date().toISOString().split('T')[0], notes: '', subTasks: [{text:'', done:false}]
        });
        const [loadingAi, setLoadingAi] = useState(false);

        const callGemini = async (prompt, systemInstruction) => {
            setLoadingAi(true);
            let retries = 0;
            const maxRetries = 5;
            
            const makeRequest = async () => {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                if (!response.ok) throw new Error('API Error');
                return await response.json();
            };

            try {
                while (retries < maxRetries) {
                    try {
                        const data = await makeRequest();
                        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        return JSON.parse(text);
                    } catch (e) {
                        retries++;
                        if (retries === maxRetries) throw e;
                        await new Promise(r => setTimeout(r, Math.pow(2, retries) * 500));
                    }
                }
            } catch (err) {
                console.error(err);
                return null;
            } finally {
                setLoadingAi(false);
            }
        };

        const aiGenerateTasks = async () => {
            if (!form.name) return;
            const result = await callGemini(
                `專案類別: ${form.category}, 專案名稱: ${form.name}`,
                "你是一個資深專案經理。請根據專案名稱拆解出 3 到 5 個具體的子任務清單。請以 JSON 格式回傳，格式如：{\"tasks\": [\"任務1\", \"任務2\"]}"
            );
            if (result && result.tasks) {
                setForm(prev => ({
                    ...prev,
                    subTasks: result.tasks.map(t => ({ text: t, done: false }))
                }));
            }
        };

        const aiSuggestNotes = async () => {
            if (!form.name) return;
            const result = await callGemini(
                `專案類別: ${form.category}, 專案名稱: ${form.name}`,
                "你是一個專業的助理。請為這個專案生成一段約 50 字的專業建議備註，包含注意事項或目標。請以 JSON 格式回傳，格式如：{\"notes\": \"建議內容...\"}"
            );
            if (result && result.notes) {
                setForm(prev => ({ ...prev, notes: result.notes }));
            }
        };

        return (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[80] p-4">
                <div className="glass-panel w-full max-w-xl rounded-3xl p-8 max-h-[90vh] overflow-y-auto custom-scroll shadow-2xl relative">
                    {loadingAi && (
                        <div className="absolute top-4 right-12 flex items-center gap-2 text-indigo-400 text-xs font-bold animate-pulse">
                            <i className="fas fa-robot"></i> AI 思考中...
                        </div>
                    )}
                    
                    <h2 className="text-2xl font-black text-white italic mb-8 uppercase flex items-center gap-3">
                        專案設定
                    </h2>
                    
                    <form onSubmit={e => { e.preventDefault(); onSave(form); }} className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input required className="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm text-white focus:border-blue-500 outline-none transition-all" placeholder="專案名稱" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                            <select className="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm text-white outline-none" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
                                {Object.keys(CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-4">
                            <input type="date" className="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm text-white" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} />
                            <input type="date" className="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm text-white" value={form.endDate} onChange={e => setForm({...form, endDate: e.target.value})} />
                        </div>
                        
                        <div className="space-y-3">
                            <div className="flex justify-between items-center">
                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">子任務</label>
                                <button 
                                    type="button" 
                                    onClick={aiGenerateTasks}
                                    disabled={!form.name || loadingAi}
                                    className="text-[10px] bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500 hover:text-white px-3 py-1 rounded-full font-bold transition-all disabled:opacity-50"
                                >
                                    <i className="fas fa-magic mr-1"></i> ✨ AI 自動拆解
                                </button>
                            </div>
                            {form.subTasks.map((t, idx) => (
                                <div key={idx} className="flex gap-2 mb-2">
                                    <input className="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white" value={t.text} onChange={e => {
                                        const s = [...form.subTasks]; s[idx].text = e.target.value; setForm({...form, subTasks: s});
                                    }} />
                                    <button type="button" onClick={() => setForm({...form, subTasks: form.subTasks.filter((_, i) => i !== idx)})} className="text-rose-500 hover:text-rose-400 transition-colors"><i className="fas fa-minus-circle"></i></button>
                                </div>
                            ))}
                            <button type="button" onClick={() => setForm({...form, subTasks: [...form.subTasks, {text:'', done:false}]})} className="text-xs text-blue-500 font-bold hover:text-blue-400 transition-colors">+ 新增細項</button>
                        </div>
                        
                        <div className="space-y-3">
                            <div className="flex justify-between items-center">
                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">備註</label>
                                <button 
                                    type="button" 
                                    onClick={aiSuggestNotes}
                                    disabled={!form.name || loadingAi}
                                    className="text-[10px] bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-white px-3 py-1 rounded-full font-bold transition-all disabled:opacity-50"
                                >
                                    <i className="fas fa-sparkles mr-1"></i> ✨ AI 建議備註
                                </button>
                            </div>
                            <textarea rows="3" className="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm text-white focus:border-blue-500 outline-none transition-all" value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} />
                        </div>
                        
                        <div className="flex gap-4 pt-4">
                            <button type="button" onClick={onClose} className="flex-1 py-4 font-bold text-slate-400 hover:text-slate-200 transition-colors">取消</button>
                            <button type="submit" className="flex-1 bg-blue-600 py-4 rounded-2xl font-bold text-white shadow-lg hover:bg-blue-500 transition-all">儲存變更</button>
                        </div>
                    </form>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
