<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kevin Yang 工作進度</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Import Map for Firebase -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js"
            }
        }
    </script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['Inter', 'Microsoft JhengHei', 'sans-serif'],
                },
                extend: {
                    colors: {
                        bgDark: '#0f172a',
                        glass: 'rgba(30, 41, 59, 0.85)',
                        glassHover: 'rgba(51, 65, 85, 0.9)',
                        accent: '#3b82f6',
                        accentGlow: 'rgba(59, 130, 246, 0.5)',
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(59, 130, 246, 0.4)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .custom-checkbox {
            appearance: none;
            background-color: rgba(255,255,255,0.05);
            margin: 0;
            font: inherit;
            width: 1.2em;
            height: 1.2em;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut, signInWithCustomToken } from "firebase/auth";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc } from "firebase/firestore";
        import { getAnalytics } from "firebase/analytics";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDKNyqJCEbI5uCSUc4ws7dKuyBZA2lRaOA",
            authDomain: "kevinwork-eb7cc.firebaseapp.com",
            databaseURL: "https://kevinwork-eb7cc-default-rtdb.firebaseio.com",
            projectId: "kevinwork-eb7cc",
            storageBucket: "kevinwork-eb7cc.firebasestorage.app",
            messagingSenderId: "462117666080",
            appId: "1:462117666080:web:4289c00cc5144f98f6eb45",
            measurementId: "G-2DRK1D06QE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);
        
        // 修改處：將 appId 固定，確保跨裝置、跨環境都能讀取到同一份資料
        const appId = 'kevin-dashboard-sync-v1';

        window.db = db;
        window.auth = auth;
        window.firebaseAppId = appId;
        window.signInWithPopup = signInWithPopup;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
        window.collection = collection;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
        window.signInWithCustomToken = signInWithCustomToken;
        window.query = query; 
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const apiKey = ""; // API Key 

        const downloadICS = (project) => {
            const formatDate = (dateStr) => dateStr.replace(/-/g, '');
            const getNextDay = (dateStr) => {
                if (!dateStr) return '';
                const date = new Date(dateStr);
                date.setDate(date.getDate() + 1);
                return date.toISOString().split('T')[0].replace(/-/g, '');
            };

            const startDate = formatDate(project.startDate);
            const endDate = getNextDay(project.deadline);

            let description = `備註: ${project.notes || '無'}\\n\\n子任務清單:\\n`;
            if (project.subtasks && Array.isArray(project.subtasks)) {
                project.subtasks.forEach(task => {
                    const status = task.completed ? '[v]' : '[ ]';
                    description += `${status} ${task.text}\\n`;
                });
            }

            const icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Kevin Yang Dashboard//ZH',
                'BEGIN:VEVENT',
                `UID:${project.id}-${Date.now()}@kevin-dashboard`,
                `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
                `DTSTART;VALUE=DATE:${startDate}`,
                `DTEND;VALUE=DATE:${endDate}`,
                `SUMMARY:[${project.category}] ${project.title}`,
                `DESCRIPTION:${description}`,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${project.title}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- Components ---

        const LoginScreen = ({ onLogin, onGuest }) => {
            return (
                <div className="min-h-screen flex items-center justify-center relative p-4">
                    <div className="fixed top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[128px] pointer-events-none"></div>
                    <div className="fixed bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-purple-600/15 rounded-full blur-[128px] pointer-events-none"></div>

                    <div className="glass-panel w-full max-w-sm sm:max-w-md p-6 sm:p-8 rounded-2xl shadow-2xl text-center border border-white/10 z-10 animate-fade-in mx-4">
                        <div className="mb-8">
                            <div className="w-16 h-16 sm:w-20 sm:h-20 bg-accent/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-accent/30 shadow-glow">
                                <i className="fa-solid fa-layer-group text-2xl sm:text-3xl text-accent"></i>
                            </div>
                            <h1 className="text-2xl sm:text-3xl font-black italic tracking-tighter text-white mb-2">
                                Kevin Yang
                            </h1>
                            <p className="text-slate-400 text-sm">專案進度管理儀表板</p>
                        </div>

                        <div className="space-y-4">
                            <button onClick={onLogin} className="w-full bg-white text-slate-900 font-bold py-3 px-4 rounded-xl hover:bg-slate-100 transition-all flex items-center justify-center gap-3 shadow-lg active:scale-95">
                                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5" alt="Google" />
                                使用 Google 帳號登入
                            </button>
                            <div className="relative py-2">
                                <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-700"></div></div>
                                <div className="relative flex justify-center text-sm"><span className="px-2 bg-[#1e293b] text-slate-500 rounded">或</span></div>
                            </div>
                            <button onClick={onGuest} className="w-full bg-slate-800/50 text-slate-300 font-medium py-3 px-4 rounded-xl hover:bg-slate-800 hover:text-white border border-slate-700 transition-all active:scale-95">
                                <i className="fa-solid fa-user-secret mr-2"></i> 訪客模式 (Guest)
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, onClose, onConfirm, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-xs sm:max-w-sm glass-panel rounded-xl p-6 animate-fade-in text-center border border-white/10 shadow-2xl mx-4">
                        <div className="text-4xl text-red-400 mb-4"><i className="fa-solid fa-triangle-exclamation"></i></div>
                        <h3 className="text-lg font-bold text-white mb-2">確認刪除</h3>
                        <div className="mb-6 text-slate-300 text-sm">{message}</div>
                        <div className="flex justify-center gap-3">
                            <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg text-sm text-slate-300 bg-slate-700/50 hover:bg-slate-700 transition-all">取消</button>
                            <button onClick={onConfirm} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-bold text-white bg-red-500 hover:bg-red-600 shadow-lg shadow-red-500/20 transition-all">
                                確定
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ReportModal = ({ isOpen, onClose, projects }) => {
            if (!isOpen) return null;
            const [dateRange, setDateRange] = useState({ start: '', end: '' });

            useEffect(() => {
                if(isOpen) {
                    const now = new Date();
                    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
                    const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
                    setDateRange({ start: firstDay, end: lastDay });
                }
            }, [isOpen]);

            const filteredData = useMemo(() => {
                if (!dateRange.start || !dateRange.end) return [];
                return projects.filter(p => p.startDate <= dateRange.end && p.deadline >= dateRange.start);
            }, [projects, dateRange]);

            const getMonthDisplay = (start, end) => {
                const s = new Date(start);
                const e = new Date(end);
                return (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) ? `${s.getMonth() + 1}月` : `${s.getMonth() + 1}月 - ${e.getMonth() + 1}月`;
            };

            const getStatus = (p) => {
                const total = p.subtasks ? p.subtasks.length : 0;
                const completed = p.subtasks ? p.subtasks.filter(t => t.completed).length : 0;
                return (total > 0 && total === completed) ? '已完成' : '進行中';
            };

            const exportCSV = () => {
                let csvContent = "\uFEFF專案名稱,類別,開始日期,截止日期,執行月份,狀態,進度\n";
                filteredData.forEach(p => {
                    const status = getStatus(p);
                    const subtasks = p.subtasks || [];
                    const progress = subtasks.length > 0 ? Math.round((subtasks.filter(t => t.completed).length / subtasks.length) * 100) + '%' : '0%';
                    const month = getMonthDisplay(p.startDate, p.deadline);
                    csvContent += `"${p.title}","${p.category}","${p.startDate}","${p.deadline}","${month}","${status}","${progress}"\n`;
                });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
                link.setAttribute("download", `Report_${dateRange.start}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-3xl glass-panel rounded-2xl shadow-2xl flex flex-col max-h-[85vh] animate-fade-in mx-2">
                        <div className="px-4 sm:px-6 py-4 border-b border-white/10 bg-slate-800/50 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white tracking-wide flex items-center">
                                <i className="fa-solid fa-chart-pie text-accent mr-2"></i>報表
                            </h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white p-2"><i className="fa-solid fa-times text-lg"></i></button>
                        </div>
                        <div className="p-4 sm:p-6 pb-2 grid grid-cols-2 gap-3 sm:gap-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">起始</label>
                                <input type="date" className="w-full glass-input px-3 py-2 rounded-lg text-sm" value={dateRange.start} onChange={e => setDateRange({...dateRange, start: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">結束</label>
                                <input type="date" className="w-full glass-input px-3 py-2 rounded-lg text-sm" value={dateRange.end} onChange={e => setDateRange({...dateRange, end: e.target.value})} />
                            </div>
                        </div>
                        <div className="flex-grow overflow-auto p-4 sm:p-6 custom-scrollbar">
                            <table className="w-full text-left border-collapse min-w-[400px]">
                                <thead>
                                    <tr className="text-xs text-slate-400 uppercase border-b border-white/10">
                                        <th className="pb-3 pl-2">專案</th>
                                        <th className="pb-3">類別</th>
                                        <th className="pb-3">月份</th>
                                        <th className="pb-3">狀態</th>
                                    </tr>
                                </thead>
                                <tbody className="text-sm">
                                    {filteredData.map(p => (
                                        <tr key={p.id} className="border-b border-white/5">
                                            <td className="py-3 pl-2 font-medium text-white">{p.title}</td>
                                            <td className="py-3 text-slate-300">{p.category}</td>
                                            <td className="py-3 text-slate-300 text-xs sm:text-sm font-mono">{getMonthDisplay(p.startDate, p.deadline)}</td>
                                            <td className="py-3">
                                                <span className={`px-2 py-1 rounded text-xs font-bold ${getStatus(p) === '已完成' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>{getStatus(p)}</span>
                                            </td>
                                        </tr>
                                    ))}
                                    {filteredData.length === 0 && <tr><td colSpan="4" className="text-center py-8 text-slate-500 italic">無資料</td></tr>}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-4 border-t border-white/10 bg-slate-800/50 flex justify-end gap-3">
                            <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white bg-slate-800/50">關閉</button>
                            <button onClick={exportCSV} disabled={filteredData.length === 0} className="px-4 py-2 rounded-lg text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 shadow-lg disabled:opacity-50 flex items-center gap-2">
                                <i className="fa-solid fa-file-csv"></i> 匯出
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const CircularProgress = ({ percentage, size = 60, strokeWidth = 5 }) => {
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (percentage / 100) * circumference;
            return (
                <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
                    <svg className="transform -rotate-90 w-full h-full">
                        <circle className="text-slate-700" strokeWidth={strokeWidth} stroke="currentColor" fill="transparent" r={radius} cx={size / 2} cy={size / 2} />
                        <circle className="text-accent transition-all duration-1000 ease-out" strokeWidth={strokeWidth} strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round" stroke="currentColor" fill="transparent" r={radius} cx={size / 2} cy={size / 2} />
                    </svg>
                    <span className="absolute text-xs font-bold text-white">{percentage}%</span>
                </div>
            );
        };

        const Badge = ({ category }) => {
            const getColors = (cat) => {
                switch(cat) {
                    case "社群官網": return "bg-cyan-500/10 text-cyan-400 border-cyan-500/30";
                    case "設計": return "bg-pink-500/10 text-pink-400 border-pink-500/30";
                    case "數位廣告": return "bg-purple-500/10 text-purple-400 border-purple-500/30";
                    case "展覽": return "bg-amber-500/10 text-amber-400 border-amber-500/30";
                    case "影片": return "bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
                    default: return "bg-slate-500/10 text-slate-400 border-slate-500/30";
                }
            };
            return <span className={`px-2 py-0.5 rounded text-[10px] sm:text-[11px] font-medium border tracking-wide ${getColors(category)}`}>{category}</span>;
        };

        const ProjectCard = ({ project, onToggleTask, onDelete, onEdit, onQuickComplete }) => {
            const [expanded, setExpanded] = useState(false);
            const total = project.subtasks ? project.subtasks.length : 0;
            const completed = project.subtasks ? project.subtasks.filter(t => t.completed).length : 0;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            const { daysLeft, statusColor, statusLabel } = useMemo(() => {
                const today = new Date();
                today.setHours(0,0,0,0);
                const due = new Date(project.deadline);
                due.setHours(0,0,0,0);
                const diffTime = due - today;
                const days = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                let color = "text-slate-300";
                let label = "DAYS LEFT";
                if (days < 0) { color = "text-red-500"; label = "OVERDUE"; }
                else if (days === 0) { color = "text-amber-400"; label = "DUE TODAY"; }
                else if (days < 3) { color = "text-red-400"; }
                return { daysLeft: days, statusColor: color, statusLabel: label };
            }, [project.deadline]);

            return (
                <div className={`glass-panel rounded-xl mb-4 transition-all duration-300 group overflow-hidden ${expanded ? 'bg-slate-800/80 ring-1 ring-white/10' : 'hover:bg-slate-800/40'}`}>
                    <div className="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between cursor-pointer relative gap-4 sm:gap-0" onClick={() => setExpanded(!expanded)}>
                        <div className="flex items-center gap-4">
                            <div className="flex-shrink-0">
                                <CircularProgress percentage={percentage} size={52} strokeWidth={4} />
                            </div>
                            <div>
                                <div className="flex items-center gap-2 mb-1">
                                    <Badge category={project.category} />
                                    <span className="text-xs text-slate-400 font-mono tracking-wide">{project.deadline}</span>
                                </div>
                                <h3 className="text-lg sm:text-xl font-bold text-white group-hover:text-accent transition-colors tracking-tight line-clamp-1">
                                    {project.title}
                                </h3>
                            </div>
                        </div>

                        <div className="flex items-center justify-between sm:justify-end gap-4 border-t border-white/5 sm:border-0 pt-3 sm:pt-0">
                            <div className="flex items-center gap-2">
                                <button onClick={(e) => { e.stopPropagation(); onQuickComplete(project); }} className="w-8 h-8 rounded-full bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500 hover:text-white border border-emerald-500/20 flex items-center justify-center transition-all active:scale-95">
                                    <i className="fa-solid fa-check"></i>
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); onDelete(project.id); }} className="w-8 h-8 rounded-full bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/20 flex items-center justify-center transition-all active:scale-95">
                                    <i className="fa-solid fa-trash"></i>
                                </button>
                            </div>
                            <div className="flex items-center gap-3">
                                <div className={`flex flex-col items-end ${statusColor}`}>
                                    <span className="text-xl sm:text-2xl font-bold leading-none">{daysLeft < 0 ? Math.abs(daysLeft) : daysLeft}</span>
                                    <span className="text-[10px] uppercase tracking-wider opacity-70 font-bold">{statusLabel}</span>
                                </div>
                                <div className={`w-6 h-6 rounded-full flex items-center justify-center transition-transform duration-300 ${expanded ? 'rotate-180 bg-slate-700' : 'bg-transparent'}`}>
                                    <i className="fa-solid fa-chevron-down text-xs text-slate-400"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className={`transition-all duration-500 ease-in-out overflow-hidden ${expanded ? 'max-h-[800px] opacity-100' : 'max-h-0 opacity-0'}`}>
                        <div className="p-4 sm:p-6 pt-2 border-t border-white/5 grid grid-cols-1 md:grid-cols-12 gap-6 md:gap-8">
                            <div className="md:col-span-7">
                                <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Subtasks</h4>
                                <div className="space-y-3">
                                    {project.subtasks && project.subtasks.map(task => (
                                        <div key={task.id} className="flex items-start gap-3">
                                            <input type="checkbox" checked={task.completed} onChange={() => onToggleTask(project, task.id)} className="custom-checkbox mt-0.5 flex-shrink-0" />
                                            <span className={`text-sm leading-relaxed transition-all ${task.completed ? 'text-slate-500 line-through decoration-slate-600' : 'text-slate-200'}`}>{task.text}</span>
                                        </div>
                                    ))}
                                    {(!project.subtasks || project.subtasks.length === 0) && <p className="text-slate-500 italic text-sm">無子任務</p>}
                                </div>
                            </div>
                            <div className="md:col-span-5 flex flex-col h-full bg-slate-900/30 rounded-lg p-4 border border-white/5">
                                <div className="flex-grow space-y-4">
                                    <div>
                                        <h4 className="text-[10px] font-bold text-slate-500 uppercase mb-1">Schedule</h4>
                                        <div className="flex justify-between text-sm text-slate-300 font-mono bg-slate-800/50 p-2 rounded border border-white/5">
                                            <span>{project.startDate}</span><span className="text-slate-500">to</span><span>{project.deadline}</span>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className="text-[10px] font-bold text-slate-500 uppercase mb-1">Notes</h4>
                                        <p className="text-sm text-slate-400 leading-relaxed min-h-[60px]">{project.notes || "無備註"}</p>
                                    </div>
                                </div>
                                <div className="flex gap-2 mt-4 pt-4 border-t border-white/5">
                                    <button onClick={() => downloadICS(project)} className="flex-1 py-2 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs flex items-center justify-center gap-1"><i className="fa-solid fa-calendar-alt"></i></button>
                                    <button onClick={() => onEdit(project)} className="flex-1 py-2 rounded bg-slate-700/50 text-slate-300 text-xs">編輯</button>
                                    <button onClick={() => onDelete(project.id)} className="flex-1 py-2 rounded bg-red-500/10 text-red-400 border border-red-500/20 text-xs">刪除</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AddProjectModal = ({ isOpen, onClose, onSave, projectToEdit }) => {
            if (!isOpen) return null;
            const defaultFormState = { title: '', category: '社群官網', startDate: '', deadline: '', notes: '', subtasks: [{ id: Date.now(), text: '', completed: false }] };
            const [form, setForm] = useState(defaultFormState);
            const [isGenerating, setIsGenerating] = useState(false);
            const [errorMsg, setErrorMsg] = useState(''); 
            const subtaskInputRefs = useRef([]);
            const prevSubtaskCount = useRef(form.subtasks.length);

            useEffect(() => {
                if (isOpen) {
                    setForm(projectToEdit || { ...defaultFormState, subtasks: [{ id: Date.now(), text: '', completed: false }] });
                    setErrorMsg(''); 
                }
            }, [isOpen, projectToEdit]);

            useEffect(() => {
                if (form.subtasks.length > prevSubtaskCount.current) subtaskInputRefs.current[form.subtasks.length - 1]?.focus();
                prevSubtaskCount.current = form.subtasks.length;
            }, [form.subtasks.length]);

            const updateSubtask = (idx, val) => {
                const newTasks = [...form.subtasks];
                newTasks[idx].text = val;
                setForm({...form, subtasks: newTasks});
            };
            const addSubtaskRow = () => setForm({...form, subtasks: [...form.subtasks, { id: Date.now() + Math.random(), text: '', completed: false }]});
            const removeSubtaskRow = (idx) => setForm({...form, subtasks: form.subtasks.filter((_, i) => i !== idx)});

            // Robust API Call with Retry
            const callGeminiAPI = async (prompt) => {
                // 如果是下載後執行，請確保這裡填入有效的 API Key
                // const apiKey = "YOUR_API_KEY"; 
                if (!apiKey && window.location.hostname !== 'localhost' && !window.location.hostname.includes('firebaseapp')) {
                     // 在預覽環境中，apiKey 會由環境自動注入，如果是本地執行則需要手動填寫
                }
                
                // 注意：在預覽環境必須使用 gemini-2.5-flash-preview-09-2025
                // 如果您下載後使用自己的 Key 遇到 404 錯誤，請將下方的模型名稱改為 'gemini-1.5-flash'
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                
                let retries = 0;
                const maxRetries = 3;
                
                while (retries <= maxRetries) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            // If 4xx error (client side), don't retry, throw immediately
                            if (response.status >= 400 && response.status < 500) {
                                const errData = await response.json().catch(() => ({}));
                                throw new Error(`API 請求錯誤 (${response.status}): ${errData.error?.message || response.statusText}`);
                            }
                            throw new Error(`伺服器錯誤 (${response.status})`);
                        }
                        return await response.json();
                    } catch (error) {
                        if (retries === maxRetries || error.message.includes("API 請求錯誤")) throw error;
                        await new Promise(r => setTimeout(r, 1000 * Math.pow(2, retries))); // Exponential backoff
                        retries++;
                    }
                }
            };

            const handleAIGenerate = async () => {
                setErrorMsg('');
                if (!form.title) {
                    setErrorMsg("⚠️ 請先輸入專案名稱");
                    return;
                }
                
                setIsGenerating(true);
                try {
                    const prompt = `Generate a JSON object for a project titled: '${form.title}'. Structure: {"category": "One of ['社群官網', '設計', '數位廣告', '展覽', '影片']", "description": "Short summary in Traditional Chinese", "subtasks": [{"text": "Task 1", "completed": false}, {"text": "Task 2", "completed": false}], "notes": "Short note"}. Strictly JSON.`;
                    
                    const data = await callGeminiAPI(prompt);
                    
                    if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                        const raw = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                        const gen = JSON.parse(raw);
                        setForm(prev => ({
                            ...prev,
                            category: gen.category || prev.category,
                            notes: gen.notes || gen.description || prev.notes,
                            subtasks: gen.subtasks?.map((t, i) => ({ id: Date.now()+i, text: t.text, completed: false })) || prev.subtasks
                        }));
                    } else {
                        throw new Error("AI 未回傳有效內容");
                    }
                } catch (e) { 
                    console.error("AI Error", e); 
                    setErrorMsg(`❌ ${e.message || "生成失敗"}`); 
                } 
                finally { setIsGenerating(false); }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({ ...form, subtasks: form.subtasks.filter(t => t.text.trim() !== '') });
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-2xl glass-panel rounded-2xl shadow-glass overflow-hidden animate-fade-in flex flex-col max-h-[90vh] mx-2">
                        <div className="px-5 py-4 border-b border-white/10 bg-slate-800/50 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white tracking-wide">{projectToEdit ? '編輯專案' : '新專案'}</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><i className="fa-solid fa-times text-lg"></i></button>
                        </div>
                        <div className="overflow-y-auto p-5 custom-scrollbar flex-grow">
                            <form id="projectForm" onSubmit={handleSubmit} className="space-y-4">
                                {/* Error Message Display */}
                                {errorMsg && (
                                    <div className="bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg text-sm flex items-center gap-2 animate-pulse">
                                        <i className="fa-solid fa-circle-exclamation"></i>
                                        {errorMsg}
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="md:col-span-2">
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="text-xs font-bold text-slate-400 uppercase">名稱</label>
                                            <button type="button" onClick={handleAIGenerate} disabled={isGenerating} className={`text-xs font-bold px-2 py-1 rounded transition-all flex items-center gap-1 ${isGenerating ? 'bg-slate-700 text-slate-400' : 'bg-gradient-to-r from-purple-500 to-indigo-500 text-white shadow-lg'}`}>
                                                {isGenerating ? <><i className="fa-solid fa-spinner fa-spin"></i> 思考中...</> : <><i className="fa-solid fa-wand-magic-sparkles"></i> AI 填寫</>}
                                            </button>
                                        </div>
                                        <input required type="text" className="w-full glass-input px-3 py-2 rounded-lg" placeholder="例如: 舉辦尾牙" value={form.title} onChange={e => setForm({...form, title: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">類別</label>
                                        <select className="w-full glass-input px-3 py-2 rounded-lg" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
                                            {['社群官網','設計','數位廣告','展覽','影片'].map(c=><option key={c} value={c} className="bg-slate-900">{c}</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="block text-xs font-bold text-slate-400 uppercase mb-1">開始</label><input required type="date" className="w-full glass-input px-2 py-2 rounded-lg text-sm" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} /></div>
                                        <div><label className="block text-xs font-bold text-slate-400 uppercase mb-1">結束</label><input required type="date" className="w-full glass-input px-2 py-2 rounded-lg text-sm" value={form.deadline} onChange={e => setForm({...form, deadline: e.target.value})} /></div>
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">子任務</label>
                                        <div className="space-y-2 mb-2">
                                            {form.subtasks.map((task, idx) => (
                                                <div key={task.id} className="flex gap-2">
                                                    <input ref={el => subtaskInputRefs.current[idx] = el} type="text" className="flex-grow glass-input px-3 py-2 rounded text-sm" placeholder="任務..." value={task.text} onChange={(e) => updateSubtask(idx, e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addSubtaskRow(); } }} />
                                                    <button type="button" onClick={() => removeSubtaskRow(idx)} className="px-2 text-slate-500 hover:text-red-400"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                        <button type="button" onClick={addSubtaskRow} className="text-xs text-accent font-medium flex items-center gap-1"><i className="fa-solid fa-plus"></i> 新增任務</button>
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">備註</label>
                                        <textarea className="w-full glass-input px-3 py-2 rounded-lg h-20 resize-none" value={form.notes} onChange={e => setForm({...form, notes: e.target.value})}></textarea>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div className="p-4 border-t border-white/10 bg-slate-800/50 flex justify-end gap-3 shrink-0">
                            <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white bg-slate-700/30">取消</button>
                            <button form="projectForm" type="submit" className="px-6 py-2 rounded-lg text-sm font-bold text-white bg-accent shadow-glow hover:bg-blue-600 active:scale-95 transition-all">儲存</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [projects, setProjects] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isReportModalOpen, setIsReportModalOpen] = useState(false);
            const [filter, setFilter] = useState('all'); 
            const [editingProject, setEditingProject] = useState(null); 
            const [deleteModalOpen, setDeleteModalOpen] = useState(false);
            const [projectToDelete, setProjectToDelete] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await window.signInWithCustomToken(window.auth, __initial_auth_token);
                };
                initAuth();
                return window.onAuthStateChanged(window.auth, (currentUser) => { setUser(currentUser); setLoading(false); });
            }, []);

            useEffect(() => {
                if (!user) { setProjects([]); return; }
                const q = window.query(window.collection(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects'));
                return window.onSnapshot(q, (snap) => {
                    setProjects(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt));
                }, err => console.error(err));
            }, [user]);

            const handleToggleTask = async (project, taskId) => {
                const updatedSubtasks = project.subtasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t);
                try { await window.updateDoc(window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', project.id), { subtasks: updatedSubtasks }); } catch (e) {}
            };

            const handleQuickComplete = async (project) => {
                try { await window.updateDoc(window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', project.id), { subtasks: project.subtasks.map(t => ({ ...t, completed: true })) }); } catch (e) {}
            };

            const handleConfirmDelete = async () => {
                setDeleteModalOpen(false); // OPTIMISTIC CLOSE: Close immediately for better UX
                if (projectToDelete && user) {
                    try { await window.deleteDoc(window.doc(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects', projectToDelete)); } 
                    catch (e) { console.error(e); alert("刪除失敗"); }
                    setProjectToDelete(null);
                }
            };

            const handleSaveProject = async (projectData) => {
                if (!user) return;
                try {
                    const colRef = window.collection(window.db, 'artifacts', window.firebaseAppId, 'users', user.uid, 'projects');
                    if (editingProject) await window.setDoc(window.doc(colRef, projectData.id), { ...projectData, updatedAt: Date.now() }, { merge: true });
                    else await window.addDoc(colRef, { ...projectData, createdAt: Date.now() });
                    setIsModalOpen(false); setEditingProject(null);
                } catch (e) { alert("儲存失敗"); }
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-[#0f172a] text-white">載入中...</div>;
            if (!user) return <LoginScreen onLogin={async () => { try { await window.signInWithPopup(window.auth, new window.GoogleAuthProvider()); } catch(e){ if(e.code==='auth/unauthorized-domain') alert('網域未授權'); } }} onGuest={() => window.signInAnonymously(window.auth)} />;

            const filtered = projects.filter(p => {
                const total = p.subtasks?.length || 0;
                const completed = p.subtasks?.filter(t => t.completed).length || 0;
                if (filter === 'completed') return total > 0 && total === completed;
                if (filter === 'active') return total === 0 || total !== completed;
                return true;
            });

            return (
                <div className="min-h-screen relative pb-20">
                    <div className="fixed top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[128px] pointer-events-none"></div>
                    <div className="fixed bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-purple-600/15 rounded-full blur-[128px] pointer-events-none"></div>

                    <div className="max-w-4xl mx-auto px-4 py-6 sm:px-6 sm:py-12 relative z-10">
                        <header className="flex flex-col md:flex-row md:items-end justify-between mb-6 pb-4 border-b border-white/5 gap-4 md:gap-0">
                            <div>
                                <h1 className="text-2xl sm:text-3xl font-black italic tracking-tighter text-white mb-2">Kevin Yang <span className="text-slate-500 not-italic font-normal text-lg sm:text-xl ml-2">工作進度</span></h1>
                                <div className="flex flex-wrap items-center gap-2">
                                    <p className="text-slate-400 text-xs sm:text-sm tracking-wide">Projects Dashboard</p>
                                    <span className="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 max-w-[150px] truncate">{user.isAnonymous ? 'Guest' : user.email}</span>
                                    <button onClick={() => window.signOut(window.auth)} className="text-xs text-red-400 hover:text-red-300">登出</button>
                                </div>
                            </div>
                            <div className="flex gap-2 w-full md:w-auto">
                                <button onClick={() => setIsReportModalOpen(true)} className="flex-1 md:flex-none group flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 px-4 py-2.5 rounded-lg transition-all active:scale-95">
                                    <i className="fa-solid fa-chart-line text-accent"></i> <span className="font-bold text-sm">報表</span>
                                </button>
                                <button onClick={() => { setEditingProject(null); setIsModalOpen(true); }} className="flex-1 md:flex-none group flex items-center justify-center gap-2 bg-accent/90 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg shadow-glow transition-all active:scale-95">
                                    <i className="fa-solid fa-plus group-hover:rotate-180 transition-transform"></i> <span className="font-bold text-sm">新增</span>
                                </button>
                            </div>
                        </header>

                        <div className="flex gap-2 mb-6 bg-slate-900/40 p-1 rounded-lg w-full md:w-fit backdrop-blur-sm border border-white/5 overflow-x-auto">
                            {['all', 'active', 'completed'].map(f => (
                                <button key={f} onClick={() => setFilter(f)} className={`flex-1 md:flex-none px-4 py-1.5 rounded-md text-sm font-medium transition-all whitespace-nowrap ${filter === f ? 'bg-accent text-white shadow-glow' : 'text-slate-400 hover:text-slate-200'}`}>
                                    {f === 'all' ? '全部' : f === 'active' ? '進行中' : '已完成'}
                                </button>
                            ))}
                        </div>

                        <div className="animate-slide-up pb-10">
                            {filtered.map(p => (
                                <ProjectCard key={p.id} project={p} onToggleTask={handleToggleTask} onDelete={(id) => { setProjectToDelete(id); setDeleteModalOpen(true); }} onEdit={(p) => { setEditingProject(p); setIsModalOpen(true); }} onQuickComplete={handleQuickComplete} />
                            ))}
                            {filtered.length === 0 && <div className="text-center py-20 border border-dashed border-slate-700 rounded-xl bg-slate-900/20"><p className="text-slate-500">無專案資料</p></div>}
                        </div>
                    </div>

                    <AddProjectModal isOpen={isModalOpen} onClose={() => { setIsModalOpen(false); setEditingProject(null); }} onSave={handleSaveProject} projectToEdit={editingProject} />
                    <ReportModal isOpen={isReportModalOpen} onClose={() => setIsReportModalOpen(false)} projects={projects} />
                    <ConfirmModal isOpen={deleteModalOpen} onClose={() => setDeleteModalOpen(false)} onConfirm={handleConfirmDelete} message="確定要刪除此專案嗎？" />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
